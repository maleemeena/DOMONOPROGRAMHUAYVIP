<!DOCTYPE html>
<html lang="th">
<head>

        :root { --gold: #d4af37; --navy: #0f172a; --accent: #f43f5e; --success: #10b981; --gold-light: #fde68a; }
        body { font-family: 'Chakra Petch', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; padding: 10px; margin: 0; }
        .container { max-width: 1200px; margin: auto; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 15px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .bulk-box { background: rgba(212, 175, 55, 0.05); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--gold); }
        .bulk-area { width: 100%; height: 100px; background: #0f172a; color: var(--gold-light); border: 1px solid var(--gold); border-radius: 10px; padding: 10px; font-size: 13px; outline: none; margin-bottom: 10px; resize: none; box-sizing: border-box; }
        .btn-bulk { background: linear-gradient(to right, #10b981, #059669); color: white; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; }
        .settings-box { background: rgba(212, 175, 55, 0.1); padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px dashed var(--gold); display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .input-config { width: 85px !important; text-align: center; border: 1px solid var(--gold) !important; background: #0f172a; color: var(--gold); border-radius: 5px; font-weight: bold; padding: 5px; }
        .input-box { background: rgba(15, 23, 42, 0.5); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; background: #0f172a; color: white; outline: none; }
        button { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-calc { background: linear-gradient(to right, #d4af37, #996515); color: #0f172a; flex: 2; }
        .btn-summary { background: #10b981; color: white; border-radius: 8px; font-size: 11px; padding: 4px 10px; border: none; }
        .btn-del { background: #450a0a; color: #f87171; padding: 4px 8px; border-radius: 5px; font-size: 10px; border: 1px solid #7f1d1d; }
        .btn-copy { width: 100%; background: var(--gold); color: #0f172a; border-radius: 5px; font-size: 11px; padding: 5px; margin-top: 5px; font-weight: bold; border:none; }
        .table-container { width: 100%; overflow-x: auto; border-radius: 15px; border: 1px solid rgba(212, 175, 55, 0.2); }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th { background: rgba(15, 23, 42, 0.9); color: var(--gold); font-size: 12px; padding: 10px; border-bottom: 1px solid var(--gold); }
        td { padding: 8px 5px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .num-card { background: rgba(255,255,255,0.08); border-radius: 4px; padding: 2px 4px; font-size: 11px; border: 1px solid transparent; display: inline-block; margin: 1px; }
        .is-win { background: rgba(16, 185, 129, 0.6) !important; border-color: var(--success) !important; color: white !important; font-weight: bold; }
        .stat-bar { margin-top: 15px; padding: 12px; background: rgba(15, 23, 42, 0.8); border-radius: 15px; display: flex; justify-content: space-around; border: 1px solid var(--gold); margin-bottom: 15px; }
        .stat-val { font-size: 18px; color: var(--success); font-weight: bold; display: block; }
        .report-area { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--gold); border-radius: 15px; padding: 15px; }
        .report-content { font-size: 11px; color: #94a3b8; white-space: pre-wrap; max-height: 200px; overflow-y: auto; margin-top: 10px; text-align: left; }
    </style>
</head>

        <div class="report-area"><h3>🔢 สายวิน <button class="btn-summary" onclick="copyFormatted('res-win', '🔢 [ รายงานสายวิน ]')">คัดลอก</button></h3><div id="res-win" class="report-content"></div></div>
        <div class="report-area"><h3>📢 สายเจาะ <button class="btn-summary" onclick="copyFormatted('res-drill', '📢 [ รายงานสายเจาะ ]')">คัดลอก</button></h3><div id="res-drill" class="report-content"></div></div>

<script>
    const KEY = 'master_premium_v2026';
    let dataList = JSON.parse(localStorage.getItem(KEY)) || [];

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = "📅 " + now.toLocaleDateString('th-TH') + " | 🕒 " + now.toLocaleTimeString('th-TH');
        setTimeout(updateClock, 1000);
    }

    function calculateFormula(inputStr) {
        // 1. ดึงค่า Power และจัดการกรณีค่าไม่ใช่ตัวเลข
        const pwrInput = document.getElementById('powerInput').value;
        const pwr = parseFloat(pwrInput) || 2;
        
        // 2. ดึงชุดตัวเลข (ดักจับกรณี inputStr สั้นเกินไป)
        const numSet = parseInt(inputStr.slice(1, 4)) || 0;
        
        // 3. คำนวณ Base (ใช้ความปลอดภัยเพื่อไม่ให้เกินขีดจำกัดตัวเลข)
        let base = Math.pow(numSet, pwr);
        if (!isFinite(base)) base = 0; // ถ้าเลขใหญ่เกินไปจนเป็น Infinity ให้รีเซ็ตเป็น 0 ป้องกัน NaN

        // 4. คำนวณ Array ผลลัพธ์
        const resArr = [
            Math.abs(base - 24), 
            Math.abs(base - 39), 
            Math.abs(base - 49), 
            Math.abs(base - 54)
        ];

        // 5. รวบรวมตัวเลขทั้งหมดและนับความถี่ (กรองค่าที่ไม่ใช่ตัวเลขออก)
        const allDigits = (resArr.join('') + inputStr.slice(1, 4))
            .split('')
            .map(Number)
            .filter(n => !isNaN(n)); // ป้องกัน NaN หลุดเข้าไปในระบบ

        const freq = {};
        allDigits.forEach(x => freq[x] = (freq[x] || 0) + 1);

        // 6. จัดลำดับเลขเด่น
        const sorted = Object.keys(freq)
            .sort((a, b) => freq[b] !== freq[a] ? freq[b] - freq[a] : b - a)
            .map(Number);

        // ดึงเลขวิน 6 ตัว (ถ้าเลขไม่พอให้ใส่ 0 แทน)
        const w6 = (sorted.length >= 6 ? sorted.slice(0, 6) : [...sorted, 0, 1, 2, 3, 4, 5].slice(0, 6)).sort((a, b) => a - b);

        // 7. คำนวณเจาะ 2 ตัว (s2)
        let s2 = []; let u2 = new Set();
        for (let i = 0; i < 2; i++) {
            for (let j = 0; j < 6; j++) {
                if (w6[i] !== w6[j] && s2.length < 8) {
                    let p = [w6[i], w6[j]].sort().join('');
                    if (!u2.has(p)) {
                        u2.add(p);
                        s2.push("" + w6[i] + w6[j]);
                    }
                }
            }
        }

        // 8. คำนวณเจาะ 3 ตัว (s3)
        let allS3 = [];
        for (let i = 0; i < 6; i++) {
            for (let j = i + 1; j < 6; j++) {
                for (let k = j + 1; k < 6; k++) {
                    allS3.push([w6[i], w6[j], w6[k]].join(''));
                }
            }
        }
        const s3Idx = [0, 3, 7, 10, 12, 15, 18, 19];
        const s3 = s3Idx.map(idx => allS3[idx]).filter(v => v);

        return { 
            focus: sorted[0] || 0, 
            ruud: (sorted[0] || 0) + "-" + (sorted[1] || 0), 
            ruudNums: [sorted[0] || 0, sorted[1] || 0], 
            win6: w6, 
            s2, 
            s3 
        };
    }

    // --- ฟังก์ชันแก้ไขปัญหาปุ่มคัดลอกบนมือถือและแอป LINE ---
    function copyToClipboard(text) {
        if (!text) return;
        
        // แผนที่ 1: ใช้ API สมัยใหม่ (ใช้ได้ใน Browser ทั่วไป)
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ คัดลอกสำเร็จ");
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            // แผนที่ 2: ใช้ Textarea (ตัวช่วยสำคัญสำหรับแอป LINE/Facebook และมือถือ)
            fallbackCopy(text);
        }
    }

    // ฟังก์ชัน Fallback สำหรับ iPhone/Android และ Webview
    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        textArea.style.fontSize = "16px"; // กันหน้าจอซูมใน iPhone
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        textArea.setSelectionRange(0, 99999); // จำเป็นมากสำหรับ iOS Safari
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                alert("✅ คัดลอกสำเร็จ");
            } else {
                alert("❌ คัดลอกไม่สำเร็จ");
            }
        } catch (err) {
            alert("❌ เบราว์เซอร์ไม่รองรับ");
        }
        document.body.removeChild(textArea);
    }

    // --- ฟังก์ชันแก้ไขปุ่มแชร์ (Web Share API) ---
    async function shareToSocial(title, text) {
        if (navigator.share) {
            try {
                await navigator.share({
                    title: title,
                    text: text
                });
            } catch (err) {
                // กรณีผู้ใช้กดยกเลิก ไม่ต้องแสดง alert
            }
        } else {
            // ถ้าเครื่องไม่รองรับแชร์ (เช่นเปิดในคอม) ให้คัดลอกเนื้อหาแทนอัตโนมัติ
            copyToClipboard(text);
            alert("อุปกรณ์ไม่รองรับการแชร์ ระบบจึงทำการคัดลอกข้อความให้แทนแล้ว");
        }
    }

    // --- ตัวอย่างการผูกฟังก์ชันกับปุ่มของคุณ (ต้องเขียนให้ครบตาม UI คุณ) ---
    function handleCopyAll() {
        if (dataList.length === 0) return alert("ไม่มีข้อมูลให้คัดลอก");
        let resultText = "📊 สรุปผลคำนวณหวยปี 2026\n\n";
        dataList.forEach((item, index) => {
            resultText += `🔹 ${item.name || 'รายการที่ ' + (index+1)}\n`;
            resultText += `เด่น: ${item.focus} | วิน: ${item.win6.join('')}\n`;
            resultText += `2 ตัว: ${item.s2.join(', ')}\n`;
            resultText += `--------------------\n`;
        });
        copyToClipboard(resultText);
    }


    function renderTable() {
        const activeId = document.activeElement ? document.activeElement.id : null;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        dataList.forEach(entry => {
            const f = calculateFormula(entry.inputStr);
            const res = entry.resultStr;
            let h = { f:false, r:false, w:false, d2:false, d3:false };
            
            if(res.length === 5) {
                const t3 = res.slice(0,3), t2 = res.slice(1,3), b2 = res.slice(3,5);
                const targets = (t2+b2).split('');
                if(targets.includes(f.focus.toString())) h.f = true;
                if(f.ruudNums.some(n => targets.includes(n.toString()))) h.r = true;
                if(t2.split('').every(x => f.win6.join('').includes(x)) || b2.split('').every(x => f.win6.join('').includes(x))) h.w = true;
                if(f.s2.some(n => sortS(n) === sortS(t2) || sortS(n) === sortS(b2))) h.d2 = true;
                if(f.s3.some(n => sortS(n) === sortS(t3))) h.d3 = true;
            }

            const row = tbody.insertRow();
            row.innerHTML = `
                <td><strong>${entry.name}</strong><br><small>${entry.time}</small></td>
                <td style="font-family:monospace; color:#94a3b8;">${entry.inputStr}</td>
                <td class="${h.f ? 'is-win' : ''}" style="font-size:18px;">${f.focus}</td>
                <td class="${h.r ? 'is-win' : ''}">${f.ruud}</td>
                <td class="${h.w ? 'is-win' : ''}">${f.win6.map(n => `<div class="num-card">${n}</div>`).join('')}</td>
                <td>${f.s2.map(n => `<div class="num-card ${isHit(n, res, 2) ? 'is-win' : ''}">${n}</div>`).join('')}</td>
                <td>${f.s3.map(n => `<div class="num-card ${isHit(n, res, 3) ? 'is-win' : ''}">${n}</div>`).join('')}</td>
                <td>
                    <input type="number" id="in-${entry.id}" class="input-config" value="${res}" oninput="updateRes('${entry.id}', this.value)">
                    <button class="btn-copy" onclick="copySingle('${entry.id}')">แชร์</button>
                </td>
                <td><button class="btn-del" onclick="deleteEntry('${entry.id}')">ลบ</button></td>
            `;
        });

        if (activeId) {
            const el = document.getElementById(activeId);
            if (el) { el.focus(); el.value = el.value; }
        }
        updateStats();
        renderSummaryBoxes();
    }

    function processBulk() {
    const raw = document.getElementById('bulkInput').value.trim();
    if (!raw) return alert("กรุณาวางข้อมูล");

    // 1. หาชื่อหัวข้อหลัก (ถ้ามี)
    let headerName = "";
    const lines = raw.split('\n');
    for (let line of lines) {
        if (line.includes("สถิติย้อนหลัง")) {
            headerName = line.replace(/สถิติย้อนหลัง/g, '').replace(/[^\u0E00-\u0E7Fa-zA-Z0-9\s]/g, '').trim();
            break;
        }
    }

    const tempData = [];
    const pattern = /(\d{3})\s*-\s*(\d{2})/;

    lines.forEach((line) => {
        const m = line.match(pattern);
        if (m) {
            // ดึงชื่อจากในบรรทัดนั้นๆ (ลบตัวเลขและสัญลักษณ์ออก)
            let rowName = line.replace(m[0], '')
                              .replace(/[0-9]{1,2}\s+(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.)\s+[0-9]{2}/g, '') // ลบวันที่
                              .replace(/[|]/g, '') // ลบขีด
                              .replace(/[^\u0E00-\u0E7Fa-zA-Z0-9\s]/g, '') // ลบอิโมจิ
                              .trim();

            tempData.push({
                name: rowName || headerName || "ทั่วไป",
                full: m[1] + m[2]
            });
        }
    });

    if (tempData.length < 1) return alert("ไม่พบรูปแบบ 000-00");

    // 2. ตรวจสอบว่าเป็นหวยประเภทเดียวกันทั้งชุดหรือไม่ (เพื่อเปิดระบบห่วงโซ่)
    const isChain = tempData.every(d => d.name === tempData[0].name);

    const newEntries = [];
    for (let i = 0; i < tempData.length; i++) {
        const current = tempData[i];
        
        // Logic ห่วงโซ่: ถ้าชื่อหวยเหมือนกันหมด ให้บรรทัดล่างตรวจบรรทัดบน (หรือ i+1 ตรวจ i)
        // กรณีสถิติที่คุณให้มา (06 อยู่บน 07 อยู่ล่าง) i+1 จะเป็นผลของ i
        let autoResult = "";
        if (isChain && tempData[i + 1]) {
            autoResult = tempData[i + 1].full;
        }

        newEntries.push({
            id: "row_" + Date.now() + "_" + i,
            name: current.name,
            inputStr: current.full,
            resultStr: autoResult,
            time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
        });
    }

    // นำเข้าข้อมูล (ถ้าเป็นห่วงโซ่ให้คงลำดับเดิมไว้เพื่อตรวจผลให้ถูกต้อง)
    dataList = isChain ? [...newEntries, ...dataList] : [...newEntries.reverse(), ...dataList];
    
    saveAndReload();
    document.getElementById('bulkInput').value = '';
    alert(isChain ? "วิเคราะห์เลขแบบอัตโนมัติสำเร็จ ✨" : "นำเข้าข้อมูลแยกประเภทสำเร็จ ✨");
}
function execBulkUpdate() {
    const raw = document.getElementById('resultBulkUpdate').value.trim();
    if (!raw) return alert("กรุณาวางข้อมูลผลตรวจ");

    const lines = raw.split('\n');
    const pattern = /(\d{3})\s*-\s*(\d{2})/; // ดักจับเลข 000-00
    let matchCount = 0;

    lines.forEach(line => {
        const m = line.match(pattern);
        if (m) {
            const res5Digit = m[1] + m[2]; // รวมเป็น 5 หลัก
            // ทำความสะอาดชื่อหวยจากบรรทัดนั้น เพื่อเอาไปเทียบในตาราง
            let lotteryName = line.replace(m[0], '').replace(/[^\u0E00-\u0E7Fa-zA-Z0-9\s]/g, '').trim();

            // วนลูปหาใน dataList (ตารางเดิมที่มีอยู่)
            for (let i = 0; i < dataList.length; i++) {
                // ถ้าชื่อตรงกัน และ ช่องผลตรวจยังว่างอยู่ ให้เติมผลลงไป
                if (lotteryName && dataList[i].name.includes(lotteryName) && dataList[i].resultStr === "") {
                    dataList[i].resultStr = res5Digit;
                    matchCount++;
                    break; // อัปเดตตัวเดียวแล้วไปบรรทัดถัดไป
                }
            }
        }
    });

    if (matchCount > 0) {
        saveAndReload(); // บันทึกและวาดตารางใหม่ครั้งเดียวตอนจบ
        document.getElementById('resultBulkUpdate').value = '';
        alert(`อัปเดตผลสำเร็จ ${matchCount} รายการ ✨`);
    } else {
        alert("ไม่พบชื่อหวยที่ตรงกัน หรือหวยนั้นมีผลตรวจอยู่แล้ว");
    }
}


function updateRes(id, val) {
    const idx = dataList.findIndex(x => x.id == id);
    if (idx > -1) {
        dataList[idx].resultStr = val.slice(0, 5);
        save(); // เซฟข้อมูลลงเครื่องตลอดเวลา
        
        // *** จุดตาย: วาดตารางใหม่เฉพาะเมื่อพิมพ์ครบ 5 หลักเท่านั้น ***
        // ถ้าพิมพ์แค่หลักที่ 1, 2, 3... จะยังไม่วาดใหม่ เมาส์เลยจะไม่หลุด
        if (val.length === 5 || val.length === 0) {
            renderTable();
        }
    }
}

    function renderSummaryBoxes() {
        const today = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
        let rep = { f: "", r: "", w: "", d: "" };
        
        [...dataList].reverse().forEach(item => {
            const f = calculateFormula(item.inputStr);
            const res = item.resultStr;
            const resDisp = res.length === 5 ? ` ➔ [${res.slice(0,3)}-${res.slice(3,5)}]` : " ➔ ⏳ รอผล";
            let s = { f:'❌', r:'❌', w:'❌', d:'❌' };
            
            if(res.length === 5) {
                const t3 = res.slice(0,3), t2 = res.slice(1,3), b2 = res.slice(3,5);
                const targets = (t2+b2).split('');
                if(targets.includes(f.focus.toString())) s.f = '✅';
                if(f.ruudNums.some(n => targets.includes(n.toString()))) s.r = '✅';
                if(t2.split('').every(x => f.win6.join('').includes(x)) || b2.split('').every(x => f.win6.join('').includes(x))) s.w = '✅';
                
                const hit2 = f.s2.some(n => sortS(n)==sortS(t2) || sortS(n)==sortS(b2));
                const hit3 = f.s3.some(n => sortS(n)==sortS(t3));
                if(hit2 || hit3) s.d = '✅';
            } else { s = { f:'⏳', r:'⏳', w:'⏳', d:'⏳' }; }

            rep.f += `${s.f} ${item.name} ➔ ${f.focus}${resDisp}\n`;
            rep.r += `${s.r} ${item.name} ➔ ${f.ruud}${resDisp}\n`;
            rep.w += `${s.w} ${item.name} ➔ ${f.win6.join('')}${resDisp}\n`;
            
            rep.d += `${s.d} ${item.name}\n`;
            rep.d += `   • เจาะ2: ${f.s2.join(', ')}\n`;
            rep.d += `   • เจาะ3: ${f.s3.join(', ')}\n`;
            rep.d += `   ${resDisp}\n━━━━━━━━━━━━━━\n`;
        });
        
        // แสดงผลในกล่อง UI
        document.getElementById('res-focus').innerText = rep.f || "ไม่มีข้อมูล";
        document.getElementById('res-ruud').innerText = rep.r || "ไม่มีข้อมูล";
        document.getElementById('res-win').innerText = rep.w || "ไม่มีข้อมูล";
        document.getElementById('res-drill').innerText = rep.d || "ไม่มีข้อมูล";

        // --- จุดที่ทำให้ปุ่มแชร์/คัดลอกรวม ทำงานได้ (ส่งค่าไปเก็บใน Window) ---
    window.currentSummary = `💎 [ สรุปรวมทุกสาย ]\n🎯 สายเน้น:\n${rep.f}\n🎡 สายรูด:\n${rep.r}\n🔢 สายวิน:\n${rep.w}\n📢 สายเจาะ:\n${rep.d}\nBy LINE ID:momongmo`;
}

    // ฟังก์ชันช่วยคัดลอกสำหรับมือถือ (รวมวิธีใหม่และวิธีสำรอง)
function smartCopy(text) {
    if (!text || text.includes("ไม่มีข้อมูล")) {
        alert("ไม่มีข้อมูลให้คัดลอก");
        return;
    }
    // ใช้ Standard API ถ้าเป็น HTTPS และ Browser รองรับ
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
            alert("คัดลอกสำเร็จ! ✨");
        }).catch(() => {
            fallbackCopy(text); // ถ้าพลาดให้ไปใช้ fallback
        });
    } else {
        fallbackCopy(text); // ใช้ fallback ทันทีถ้าอยู่ในแอป LINE/FB
    }
}

    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            alert("คัดลอกสำเร็จ! ✨");
        } catch (err) {
            alert("ไม่สามารถคัดลอกได้ กรุณาลองเปลี่ยนเบราว์เซอร์");
        }
        document.body.removeChild(textArea);
    }

    function copyFormatted(id, title) {
        const content = document.getElementById(id).innerText;
        const txt = `📊 ${title}\n━━━━━━━━━━━━━━\n${content}\n━━━━━━━━━━━━━━\nBy LINE ID:momongmo`;
        smartCopy(txt);
    }

    function copyAllSummary() {
        const txt = window.currentSummary;
        if (!txt || txt.includes("ไม่มีข้อมูล")) {
            alert("ไม่มีข้อมูลให้คัดลอก");
            return;
        }
        smartCopy(txt);
    }

    // เพิ่มฟังก์ชันสำหรับปุ่มแชร์รายหวย
    async function shareAllSummary() {
        const txt = window.currentSummary;
        if (navigator.share && txt) {
            try {
                await navigator.share({
                    title: 'สรุปผลหวยรายวัน',
                    text: txt
                });
            } catch (err) { /* ยกเลิกการแชร์ */ }
        } else {
            copyAllSummary();
            alert("แชร์ไม่ได้ ระบบทำการคัดลอกสรุปไว้ให้แทนแล้ว");
        }
    }

    // แก้ไข fallback ให้รองรับ iOS (iPhone) 2026
    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        textArea.setSelectionRange(0, 99999); // << เพิ่มบรรทัดนี้เพื่อให้ iPhone คัดลอกได้
        try {
            document.execCommand('copy');
            alert("คัดลอกสำเร็จ! ✨");
        } catch (err) {
            alert("ไม่สามารถคัดลอกได้");
        }
        document.body.removeChild(textArea);
    }

    function copySingle(id) {
        const e = dataList.find(x => x.id == id);
        if(!e) return;
        const f = calculateFormula(e.inputStr);
        const res = e.resultStr;
        let s = { f:'❌', r:'❌', w:'❌', d2:'❌', d3:'❌' };
        let resTxt = "⏳ รอผลรางวัล";

        if (res.length === 5) {
            const t3 = res.slice(0,3), t2 = res.slice(1,3), b2 = res.slice(3,5);
            const targets = (t2+b2).split('');
            if(targets.includes(f.focus.toString())) s.f = '✅';
            if(f.ruudNums.some(n => targets.includes(n.toString()))) s.r = '✅';
            if(t2.split('').every(x => f.win6.join('').includes(x)) || b2.split('').every(x => f.win6.join('').includes(x))) s.w = '✅';
            if(f.s2.some(n => sortS(n)==sortS(t2) || sortS(n)==sortS(b2))) s.d2 = '✅';
            if(f.s3.some(n => sortS(n)==sortS(t3))) s.d3 = '✅';
            resTxt = `[${t3}-${b2}]`;
        }

        const txt = `🎯 DOMINO ANALYTICS: ${e.name}\n🕒 เวลา: ${e.time}\n━━━━━━━━━━━━━━\n${s.f} เน้น: ${f.focus}\n${s.r} รูด: ${f.ruud}\n${s.w} วิน: ${f.win6.join('')}\n${s.d2} เจาะ 2: ${f.s2.join(',')}\n${s.d3} เจาะ 3: ${f.s3.join(',')}\n━━━━━━━━━━━━━━\n📢 ผล: ${resTxt}\n━━━━━━━━━━━━━━\nBy LINE ID:momongmo`;
        smartCopy(txt);
    }


    function updateStats() {
        let fC=0, rC=0, wC=0, v=0;
        dataList.forEach(e => {
            if(e.resultStr.length === 5) {
                v++; const f = calculateFormula(e.inputStr); const res = e.resultStr;
                const targets = (res.slice(1,3)+res.slice(3,5)).split('');
                if(targets.includes(f.focus.toString())) fC++;
                if(f.ruudNums.some(n => targets.includes(n.toString()))) rC++;
                if(res.slice(1,3).split('').every(x => f.win6.join('').includes(x)) || res.slice(3,5).split('').every(x => f.win6.join('').includes(x))) wC++;
            }
        });
        document.getElementById('statTotal').innerText = dataList.length;
        document.getElementById('statFocus').innerText = (v ? (fC/v*100).toFixed(1) : 0) + '%';
        document.getElementById('statRuud').innerText = (v ? (rC/v*100).toFixed(1) : 0) + '%';
        document.getElementById('statWin6').innerText = (v ? (wC/v*100).toFixed(1) : 0) + '%';
    }

    function addNewData() {
        const val = document.getElementById('mainInput').value;
        const name = document.getElementById('lotteryName').value || "ทั่วไป";
        if(val.length < 5) return alert("กรอกเลขให้ครบ");
        dataList.unshift({ id: Date.now().toString(), name, inputStr: val, resultStr: "", time: new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}) });
        document.getElementById('mainInput').value = '';
        saveAndReload();
    }

    function sortS(s) { return s.toString().split('').sort().join(''); }
    function isHit(num, res, type) {
        if(!res || res.length < 5) return false;
        const t3 = res.slice(0,3), t2 = res.slice(1,3), b2 = res.slice(3,5);
        return type === 2 ? (sortS(num) === sortS(t2) || sortS(num) === sortS(b2)) : (sortS(num) === sortS(t3));
    }
    function deleteEntry(id) { if(confirm('ลบ?')) { dataList = dataList.filter(x => x.id != id); saveAndReload(); } }
    function clearAllData() { if(confirm('ล้าง?')) { dataList = []; saveAndReload(); } }
    function save() { localStorage.setItem(KEY, JSON.stringify(dataList)); }
    function saveAndReload() { save(); renderTable(); }
    function loadData() { renderTable(); }
	
    function shareResult() {
        const f = document.getElementById('res-focus').innerText;
        const r = document.getElementById('res-ruud').innerText;
        const w = document.getElementById('res-win').innerText;
        const d = document.getElementById('res-drill').innerText;
        
        const txt = `💎 [ สรุปรวมทุกสาย ]\n🎯 สายเน้น:\n${f}\n🎡 สายรูด:\n${r}\n🔢 สายวิน:\n${w}\n📢 สายเจาะ:\n${d}\nBy LINE ID:momongmo`;

        if (navigator.share) {
            navigator.share({
                title: 'สรุปผลหวย',
                text: txt
            }).catch(console.error);
        } else {
            smartCopy(txt);
            alert("เบราว์เซอร์ไม่รองรับการแชร์ ระบบทำการคัดลอกข้อความให้แล้ว");
        }
    }
	
</script>
