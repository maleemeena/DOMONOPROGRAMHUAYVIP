<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💎 DNA 5-FORMULA PRO V12 [PREMIUM] 💎</title>
    <style>
        :root { --gold: #d4af37; --dark: #1a252f; --win: #27ae60; --win3: #e67e22; --bg: #f4f7f6; --blue: #3498db; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 8px; color: #333; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: var(--dark); color: #fff; padding: 12px; border-radius: 15px; text-align: center; border-bottom: 3px solid var(--gold); }
        .stat-card b { color: var(--gold); font-size: 18px; }
        .main-card { background: #fff; border-radius: 20px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        input, select, textarea { width: 100%; border: 1px solid #eee; border-radius: 10px; padding: 10px; font-size: 14px; outline: none; box-sizing: border-box; }
        .finance-box, .table-box { background: #fffdf0; border: 1px solid var(--gold); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
        summary { cursor: pointer; padding: 10px; font-weight: bold; text-align: center; color: var(--dark); background: #fdf5d2; list-style: none; border-bottom: 1px solid #eee; }
        .btn-scan { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; padding: 14px; border: none; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 8px; }
        .btn-calc { background: var(--dark); color: var(--gold); padding: 14px; border: 1px solid var(--gold); border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-clear { background: #e74c3c; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 14px; }
        .table-wrap { overflow-x: auto; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #f8f9fa; padding: 10px; font-size: 11px; border-bottom: 2px solid #eee; }
        td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #f1f1f1; font-size: 12px; }
        .win-tag { display: block; font-size: 10px; color: white; border-radius: 4px; padding: 2px; margin-top: 2px; font-weight: bold; line-height: 1.2; }
        .bg-win2 { background: var(--win); } .bg-win3 { background: var(--win3); } .bg-root { background: var(--blue); }
        .report-box { background: white; border-radius: 15px; padding: 15px; margin-top: 10px; border-left: 8px solid #ddd; }
        .report-box.is-best { border-left-color: var(--gold); background: #fffef2; box-shadow: 0 5px 15px rgba(212,175,55,0.1); }
        pre { white-space: pre-wrap; font-family: monospace; font-size: 13px; margin: 10px 0; line-height: 1.5; color: #444; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        .best-formula { background: #fff9e6; outline: 1px solid var(--gold); }
    </style>
</head>
<body>

<h2 style="text-align:center; color:var(--dark); margin: 10px 0;">💎 DNA 5-FORMULA PRO V12 💎</h2>

<div class="stat-grid">
    <div class="stat-card"><small>🏆 สูตรแม่นที่สุด</small><br><b id="topName">-</b></div>
    <div class="stat-card"><small>💰 กำไรสะสม</small><br><b id="topProfit">0</b></div>
</div>

<div class="main-card">
    <div class="input-row">
        <input type="text" id="lottoName" placeholder="ชื่อหวย" value="หวยยี่กี">
        <input type="text" id="adminName" placeholder="แอดมิน" value="ADMIN">
    </div>

    <div style="background: #eef7ff; padding: 12px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #3498db;">
        <small style="color:#2980b9; font-weight:bold;">🔢 กรอกผลล่าสุดเพื่อคำนวณรอบใหม่</small>
        <div class="input-row" style="margin-top:5px;">
            <input type="number" id="manualTop" placeholder="3 ตัวบน">
            <input type="number" id="manualBottom" placeholder="2 ตัวล่าง">
        </div>
    </div>

    <textarea id="bulkInput" rows="4" placeholder="วางสถิติย้อนหลัง (รองรับทุกรูปแบบ)..."></textarea>
    
    <button class="btn-scan" onclick="autoScanAll()">🚀 AI SCAN วิเคราะห์ 5 สูตร</button>
    
    <div class="input-row">
        <button class="btn-calc" onclick="processChain()">🔥 คำนวณเลขรอบใหม่</button>
        <button class="btn-clear" onclick="clearData()">🧹 ล้างข้อมูล</button>
    </div>
    
    <div class="input-row" style="margin-top:8px;">
        <select id="winType" onchange="processChain()">
            <option value="วินบนล่าง">💎 วิน 6 ตัว (บน-ล่าง)</option>
            <option value="รูด2ตัวบนล่าง">💰 รูด 2 ตัว (บน-ล่าง)</option>
        </select>
        <input type="number" id="rootVal" value="2.0" step="0.1">
    </div>
</div>

<details class="finance-box">
    <summary>⚙️ ตั้งค่าต้นทุนและราคาจ่าย</summary>
    <div style="padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div><small>ทุน/รอบ:</small><input type="number" id="cost" value="30"></div>
        <div><small>จ่าย 2ตัว:</small><input type="number" id="p2" value="90"></div>
        <div><small>จ่าย 3ตรง:</small><input type="number" id="p3s" value="900"></div>
        <div><small>จ่าย 3โต๊ด:</small><input type="number" id="p3t" value="150"></div>
    </div>
</details>

<details class="table-box" open>
    <summary>📊 ตารางตรวจสอบสถิติ 5 สูตร</summary>
    <div class="table-wrap">
        <table>
            <thead>
                <tr><th>งวด</th><th>ส.1</th><th>ส.2</th><th>ส.3</th><th>ส.4</th><th>ส.5</th><th>ผล</th></tr>
                <tr style="background:#fdf5d2" id="accRow">
                    <td>ACC%</td>
                    <td id="acc0">-</td><td id="acc1">-</td><td id="acc2">-</td><td id="acc3">-</td><td id="acc4">-</td>
                    <td>-</td>
                </tr>
            </thead>
            <tbody id="bBody"></tbody>
        </table>
    </div>
</details>

<div id="reportArea"></div>

<script>
    const labels = ["ส.1", "ส.2", "ส.3", "ส.4", "ส.5"];
    let winLogs = [[], [], [], [], []];

    function saveSet() {
        const ids = ['lottoName','adminName','winType','rootVal','manualTop','manualBottom','bulkInput','cost','p2','p3s','p3t'];
        ids.forEach(id => {
            const el = document.getElementById(id);
            if(el) localStorage.setItem('dna5_v12_'+id, el.value);
        });
    }

    window.onload = function() {
        const ids = ['lottoName','adminName','winType','rootVal','manualTop','manualBottom','bulkInput','cost','p2','p3s','p3t'];
        ids.forEach(id => {
            let val = localStorage.getItem('dna5_v12_'+id);
            if(val && document.getElementById(id)) document.getElementById(id).value = val;
        });
    };

    function extractData(t) {
        if (!t || t.trim() === "") return null;
        let clean = t.split(/➡️|->|=>|\|/).pop();
        let allNums = clean.match(/\d+/g);
        if (!allNums || allNums.length < 2) return null;
        let topG = allNums[allNums.length - 2];
        let botG = allNums[allNums.length - 1];
        let label = t.split(/➡️|->|=>|\|/)[0].trim().substring(0, 12);
        return { top: topG.slice(-3).padStart(3, '0'), bottom: botG.slice(-2).padStart(2, '0'), full: topG.slice(-3)+"-"+botG.slice(-2), label: label || "งวด" };
    }

    function calculateSets(base, r) {
        let res = [];
        let b = parseFloat(base.replace('-', '')) || 0;
        let root = parseFloat(r) || 2.0;
        for(let i=0; i<5; i++) {
            let val = Math.pow(b + (i * 876.54) + (i * i * 32.10), 1 / (root + (i * 0.07)));
            let dec = val.toFixed(20).split('.')[1];
            let subDec = dec.substring(i * 3); 
            let temp = new Set();
            for(let j=0; temp.size < 6 && j < subDec.length; j++) temp.add(subDec[j]);
            let fb = "0123456789";
            for(let j=0; temp.size < 6; j++) temp.add(fb[j]);
            res.push(Array.from(temp).join(''));
        }
        return res;
    }

    function checkWinAdvanced(set, actual, mode, all5Sets) {
        let d = extractData(actual); if(!d) return { ok: false, inc: 0, msg: '❌', tags: [] };
        let cost = parseFloat(document.getElementById('cost').value) || 0;
        let p2 = parseFloat(document.getElementById('p2').value) || 0;
        let p3s = parseFloat(document.getElementById('p3s').value) || 0;
        let p3t = parseFloat(document.getElementById('p3t').value) || 0;
        let t3 = d.top; let t2 = d.top.slice(-2); let b2 = d.bottom;
        let res = { ok: false, inc: -cost, msg: '', tags: [] };

        if (mode === "รูด2ตัวบนล่าง") {
            let r2 = set.slice(0, 2).split('');
            let hT = r2.filter(x => t2.includes(x));
            let hB = r2.filter(x => b2.includes(x));
            if(hT.length || hB.length) {
                res.ok = true; res.inc = p2 - cost;
                let hits = [...new Set([...hT, ...hB])];
                let m = `[${hits.join(',')}]`;
                if(hT.length && hB.length) { m += "รูดเด้ง"; res.inc = (p2*2)-cost; }
                else if(hT.length) m += "รูดบน";
                else m += "รูดล่าง";
                res.msg = m; res.tags.push({txt: m, cls: 'bg-root'});
            }
        } else {
            let winT = t2.split('').every(x => set.includes(x));
            let winB = b2.split('').every(x => set.includes(x));
            if(winT || winB) {
                res.ok = true; let m = "";
                if(winT) { m += `[${t2}]วินบน`; res.inc += p2; }
                if(winB) { m += (m?" ":"")+`[${b2}]วินล่าง`; res.inc += p2; }
                res.msg = m; res.tags.push({txt: m, cls: 'bg-win2'});
            }
        }

        let focusAll = all5Sets.map(s => s.slice(0, 2));
        if(focusAll.includes(t2) || focusAll.includes(b2)) {
            let hit = focusAll.includes(t2) ? t2 : b2;
            res.ok = true; res.msg += ` [${hit}]เจาะเลขเน้น🔥`;
            res.tags.push({txt: "เน้นเข้า", cls: "bg-win2"});
            res.inc = Math.max(res.inc, p2 - cost);
        }

        if(t3.split('').every(x => set.includes(x))) {
            res.ok = true; let type = (t3 === set.slice(0,3)) ? "3ตรง!" : "เจาะแตก🔥";
            res.msg += ` [${t3}]${type}`;
            res.inc = Math.max(res.inc, (type === "3ตรง!" ? p3s : p3t) - cost);
            res.tags.push({txt: type, cls: 'bg-win3'});
        }
        if(!res.ok) res.msg = '❌';
        return res;
    }

    function processChain() {
        saveSet();
        let r = document.getElementById('rootVal').value, m = document.getElementById('winType').value;
        let mTop = document.getElementById('manualTop').value.trim(), mBottom = document.getElementById('manualBottom').value.trim();
        let inputStr = document.getElementById('bulkInput').value.trim();
        let lines = inputStr.split('\n').filter(l => extractData(l) !== null);
        
        let profits = [0,0,0,0,0], winCounts = [0,0,0,0,0];
        winLogs = [[],[],[],[],[]];
        let history = [];

        if(lines.length >= 2) {
            for(let i=1; i<lines.length; i++) {
                let prev = extractData(lines[i-1]);
                let sets = calculateSets(prev.full, r);
                let d = extractData(lines[i]);
                sets.forEach((s, idx) => {
                    let res = checkWinAdvanced(s, lines[i], m, sets);
                    profits[idx] += res.inc; if(res.ok) winCounts[idx]++;
                    winLogs[idx].push(`${d.label}: ${m==="รูด2ตัวบนล่าง"?s.slice(0,2):s} [${d.full}] ${res.ok?'✅ '+res.msg:'❌'}`);
                });
                history.push({ sets, actual: lines[i], label: d.label });
            }
        }

        let bestIdx = profits.indexOf(Math.max(...profits));
        document.getElementById('topName').innerText = labels[bestIdx];
        document.getElementById('topProfit').innerText = profits[bestIdx].toLocaleString();
        labels.forEach((_, i) => document.getElementById('acc' + i).innerHTML = `<b>${lines.length>1?Math.round((winCounts[i]/(lines.length-1))*100):0}%</b>`);

        let lastData = lines.length > 0 ? extractData(lines[lines.length-1]) : {top:"000", bottom:"00", full:"000-00"};
        let nextSets = calculateSets((mTop||lastData.top)+"-"+(mBottom||lastData.bottom), r);
        let bBody = document.getElementById('bBody');
        let tableHTML = `<tr style="background:#eef7ff; font-weight:bold;"><td>NEXT</td>${nextSets.map((s,i)=>`<td class="${i==bestIdx?'best-formula':''}">${m==='รูด2ตัวบนล่าง'?s.slice(0,2):s}</td>`).join('')}<td>รอผล</td></tr>`;
        history.reverse().forEach((h) => {
            let d = extractData(h.actual);
            tableHTML += `<tr><td>${d.label}</td>${h.sets.map((s, i) => { 
                let res = checkWinAdvanced(s, h.actual, m, h.sets);
                return `<td class="${i==bestIdx?'best-formula':''}"><div>${m==='รูด2ตัวบนล่าง'?s.slice(0,2):s}</div>${res.tags.map(t=>`<span class="win-tag ${t.cls}">${t.txt}</span>`).join('') || '❌'}</td>`;
            }).join('')}<td><b>${d.top}</b><br><small>${d.bottom}</small></td></tr>`;
        });
        bBody.innerHTML = tableHTML;
        
        let area = document.getElementById('reportArea'); area.innerHTML = "";
        let summary = labels.map((name, i) => ({ id: i, name, acc: lines.length>1?Math.round((winCounts[i]/(lines.length-1))*100):0, profit: profits[i], set: nextSets[i] })).sort((a,b)=>b.acc - a.acc);
        summary.forEach((f, idx) => {
            let s = f.set; let d2 = []; for(let a=0;a<6;a++) for(let b=a+1;b<6;b++) d2.push(s[a]+s[b]);
            let d3 = []; for(let a=0;a<6;a++) for(let b=a+1;b<6;b++) for(let c=b+1;c<6;c++) d3.push(s[a]+s[b]+s[c]);
            let content = `🎯 แนวทาง ${document.getElementById('lottoName').value} 🎯\n🏆 สูตร ${f.name} [แม่น ${f.acc}%]\n━━━━━━━━━━━━\n${m === "รูด2ตัวบนล่าง" ? '🔥 รูด บน-ล่าง: '+s.slice(0,2).split('').join(',') : '💎 วินบน 6 ตัว: '+s}\n🔥 ชุดเลขเน้นๆ: ${nextSets.map(x=>x.slice(0,2)).join(', ')}\n\n📍 เจาะ 2 ตัว:\n${d2.join(' ')}\n\n📍 เจาะ 3 ตัว:\n${d3.join(' ')}\n━━━━━━━━━━━━\n📊 สถิติย้อนหลัง:\n${winLogs[f.id].slice().reverse().join('\n')}\n━━━━━━━━━━━━\n💰 กำไรสะสม: ${f.profit.toLocaleString()} บ.\nBy ${document.getElementById('adminName').value}`;
            area.innerHTML += `<div class="report-box ${idx === 0 ? 'is-best' : ''}"><strong>${idx === 0 ? '⭐ อันดับ 1: ' : ''}สูตร ${f.name}</strong><pre id="cp${f.id}">${content}</pre><button class="btn-calc" style="width:100%" onclick="copyText('cp${f.id}')">📋 คัดลอกรายงาน</button></div>`;
        });
    }

    function autoScanAll() {
        let input = document.getElementById('bulkInput').value.trim().split('\n').filter(l => extractData(l) !== null);
        if(input.length < 3) return alert("ขอสถิติ 3 งวดขึ้นไป");
        let bestR = 2.0, maxP = -Infinity, mode = document.getElementById('winType').value;
        for(let r=1.0; r<=6.0; r=parseFloat((r+0.2).toFixed(1))) {
            let tp = 0;
            for(let i=1; i<input.length; i++) {
                let p = extractData(input[i-1]);
                let sets = calculateSets(p.full, r);
                sets.forEach(s => tp += checkWinAdvanced(s, input[i], mode, sets).inc);
            }
            if(tp > maxP) { maxP = tp; bestR = r; }
        }
        document.getElementById('rootVal').value = bestR; processChain();
    }
    function copyText(id) { const text = document.getElementById(id).innerText; navigator.clipboard.writeText(text).then(() => alert("คัดลอกสำเร็จ!")); }
    function clearData() { if(confirm("ล้างข้อมูล?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
