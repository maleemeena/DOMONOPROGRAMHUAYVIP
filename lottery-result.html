<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>📊 ผลรางวัลและสถิติบอท</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fdf6f9; padding: 20px; }
        h2 { color: #d63384; text-align: center; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; font-size: 0.95rem; }
        th { background: #d63384; color: white; }
        tr:hover { background: #f1f1f1; }
    </style>
</head>
<body>
    <h2>📊 ผลรางวัลจากบอทอัตโนมัติ</h2>
    <table id="resultTable">
        <thead>
            <tr>
                <th>เวลา</th>
                <th>ผู้ใช้งาน / บอท</th>
                <th>รายละเอียดผลรางวัล (🏆)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="3" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
    </table>

    <script>
        // แทนที่ด้วย Web App URL ที่ได้จากการ Deploy ใน Google Apps Script
        const WEB_APP_URL = "ใส่_Web_App_URL_ของคุณตรงนี้";

        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector("#resultTable tbody");
                tbody.innerHTML = "";
                
                // กรองเฉพาะแถวที่มีสัญลักษณ์ 🏆 หรือข้อมูลที่ต้องการมาแสดง
                const filteredData = data.filter(row => row.history && row.history.includes("🏆"));

                if (filteredData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">ยังไม่มีข้อมูลผลรางวัลในระบบ</td></tr>`;
                    return;
                }

                // เรียงลำดับจากใหม่ไปเก่า
                filteredData.reverse().forEach(row => {
                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${row.date}</td>
                        <td>${row.name}</td>
                        <td><b>${row.history}</b></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(error => {
                console.error("Error fetching data:", error);
                document.querySelector("#resultTable tbody").innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">ไม่สามารถโหลดข้อมูลได้</td></tr>`;
            });
    </script>
</body>
</html>
