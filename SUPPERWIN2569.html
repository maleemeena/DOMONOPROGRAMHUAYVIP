<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจับวินเลขพรีเมียม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --primary-glow: #6366f1;
            --accent-glow: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 16px;
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        input[type="text"]:focus, select:focus {
            border-color: #818cf8;
            outline: none;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.4), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        select option {
            background-color: #1e1b4b;
            color: white;
        }

        .btn-grid-top {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-calculate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.6);
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
        }

        .btn-calculate:active {
            transform: translateY(1px);
        }

        .btn-clear {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.4);
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(244, 63, 94, 0.6);
            background: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
        }

        .result-section {
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 25px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vip-box {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.25));
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.15);
            backdrop-filter: blur(8px);
        }

        .vip-title {
            font-size: 15px;
            font-weight: 600;
            color: #fde68a;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .vip-numbers {
            font-size: 32px;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 6px;
            text-shadow: 0 2px 15px rgba(251, 191, 36, 0.5);
        }

        .win-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .win-ball {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4),
                        inset 0 2px 4px rgba(255, 255, 255, 0.4);
            animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            transition: transform 0.2s;
        }

        .win-ball:hover {
            transform: scale(1.1);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-no-dub { background: linear-gradient(135deg, #ec4899, #be185d); }
        .btn-3d { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .btn-2d { background: linear-gradient(135deg, #10b981, #047857); }
        .btn-with-dub { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

        .stats-badge {
            text-align: center;
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: #38bdf8;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 20px;
            font-size: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.1);
        }

        .card-output {
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-output h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            max-height: 160px;
            overflow-y: auto;
            word-break: break-all;
            line-height: 1.6;
            color: #f1f5f9;
            user-select: all;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn-copy {
            background: linear-gradient(135deg, #475569, #334155);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-copy:hover {
            background: linear-gradient(135deg, #64748b, #475569);
            transform: translateY(-1px);
        }

        .footer-credit {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 DOMINO ระบบจับวินเลขพรีเมียม </h2>
    
    <div class="form-group">
        <label for="lottoName">ชื่อหวย:</label>
        <input type="text" id="lottoName" placeholder="เช่น หวยฮานอย, หวยไทย" value="หวยหุ้นไทย" oninput="saveInputs()">
    </div>

    <div class="form-group">
        <label for="inputData">กรอกผล (เช่น 12345):</label>
        <input type="text" id="inputData" placeholder="กรอกตัวเลขผลรางวัล" maxlength="20" value="12345" oninput="saveInputs()">
    </div>

    <div class="form-group">
        <label for="winCountSelect">เลือกจำนวนตัวเลขวิน:</label>
        <select id="winCountSelect" onchange="saveInputs()">
            <option value="4">วิน 4 ตัว</option>
            <option value="5">วิน 5 ตัว</option>
            <option value="6">วิน 6 ตัว</option>
            <option value="7" selected>วิน 7 ตัว</option>
            <option value="8">วิน 8 ตัว</option>
            <option value="9">วิน 9 ตัว</option>
        </select>
    </div>

    <div class="btn-grid-top">
        <button class="btn-calculate" onclick="calculateWin()">✨ คำนวณเลขเด่น</button>
        <button class="btn-clear" onclick="clearData()">🗑️ ล้างข้อมูล</button>
    </div>

    <div class="result-section" id="resultSection" style="display: none;">
        <div class="vip-box">
            <div class="vip-title">🔥 เลขเด่น 2 ตัว (เน้นๆ) 🔥</div>
            <div class="vip-numbers" id="vipDisplay">-</div>
        </div>

        <label id="winTitleLabel" style="text-align: center;">เลขวิน (เรียงตามความถี่):</label>
        <div class="win-display" id="winBallsContainer"></div>

        <div class="btn-grid">
            <button class="action-btn btn-no-dub" onclick="generateCombinations(2, false)">✨ วินเลข 2 ตัว (ไม่รวมเบิ้ล)</button>
            <button class="action-btn btn-3d" onclick="generateCombinations(3, false)">✨ วินเลข 3 ตัว (ไม่รวมเบิ้ล)</button>
            <button class="action-btn btn-2d" onclick="generateCombinations(2, true)">⭐ วินเลข 2 ตัว (รวมเบิ้ล)</button>
            <button class="action-btn btn-with-dub" onclick="generateCombinations(3, true)">⭐ วินเลข 3 ตัว (รวมเบิ้ล)</button>
        </div>

        <div class="stats-badge" id="statsInfo">ตรง 0 เลข โต๊ด 0 เลข</div>

        <div id="outputContainer"></div>
    </div>

    <div class="footer-credit">LINE ID: momongmo</div>
</div>

<script>
    let currentWinDigits = [];
    let topTwoDigits = "";

    window.onload = function() {
        if(localStorage.getItem('lottoName')) {
            document.getElementById('lottoName').value = localStorage.getItem('lottoName');
        }
        if(localStorage.getItem('inputData')) {
            document.getElementById('inputData').value = localStorage.getItem('inputData');
        }
        if(localStorage.getItem('winCountSelect')) {
            document.getElementById('winCountSelect').value = localStorage.getItem('winCountSelect');
        }
        
        if(localStorage.getItem('savedWinDigits')) {
            currentWinDigits = JSON.parse(localStorage.getItem('savedWinDigits'));
            topTwoDigits = localStorage.getItem('savedTopTwo') || "";
            
            document.getElementById('vipDisplay').innerText = topTwoDigits;
            document.getElementById('winTitleLabel').innerText = `เลขวิน ${currentWinDigits.length} ตัว (เรียงตามความถี่):`;
            
            let ballsContainer = document.getElementById('winBallsContainer');
            ballsContainer.innerHTML = '';
            currentWinDigits.forEach(num => {
                let ball = document.createElement('div');
                ball.className = 'win-ball';
                ball.innerText = num;
                ballsContainer.appendChild(ball);
            });

            document.getElementById('resultSection').style.display = 'block';

            let lastOutput = localStorage.getItem('savedOutputHTML');
            let lastStats = localStorage.getItem('savedStatsInfo');
            if(lastOutput) {
                document.getElementById('outputContainer').innerHTML = lastOutput;
            }
            if(lastStats) {
                document.getElementById('statsInfo').innerText = lastStats;
            }
        }
    };

    function saveInputs() {
        localStorage.setItem('lottoName', document.getElementById('lottoName').value);
        localStorage.setItem('inputData', document.getElementById('inputData').value);
        localStorage.setItem('winCountSelect', document.getElementById('winCountSelect').value);
    }

    function calculateWin() {
        const rawInput = document.getElementById('inputData').value.trim();
        if (rawInput.length < 3) {
            alert('กรุณากรอกตัวเลขอย่างน้อย 3 ตัวขึ้นไป');
            return;
        }

        saveInputs();

        const first3 = parseFloat(rawInput.substring(0, 3));
        const last2 = parseFloat(rawInput.slice(-2));

        let intermediate = first3 * last2;
        let sqrtVal = Math.sqrt(intermediate);
        let percentVal = sqrtVal * 0.01;
        let finalResult = Math.pow(percentVal, 1.2);

        let resultStr = finalResult.toString().replace('.', '').replace('-', '');
        
        let freqMap = {};
        for(let i=0; i<=9; i++) freqMap[i] = 0;
        
        for(let char of resultStr) {
            let digit = parseInt(char);
            if(!isNaN(digit)) {
                freqMap[digit]++;
            }
        }

        let sortedDigits = Object.keys(freqMap).sort((a, b) => {
            if (freqMap[b] !== freqMap[a]) {
                return freqMap[b] - freqMap[a];
            }
            return b - a;
        });

        topTwoDigits = `${sortedDigits[0]} - ${sortedDigits[1]}`;
        document.getElementById('vipDisplay').innerText = topTwoDigits;

        let selectedCount = parseInt(document.getElementById('winCountSelect').value) || 7;
        currentWinDigits = sortedDigits.slice(0, selectedCount).map(Number);

        document.getElementById('winTitleLabel').innerText = `เลขวิน ${currentWinDigits.length} ตัว (เรียงตามความถี่):`;

        localStorage.setItem('savedWinDigits', JSON.stringify(currentWinDigits));
        localStorage.setItem('savedTopTwo', topTwoDigits);

        let ballsContainer = document.getElementById('winBallsContainer');
        ballsContainer.innerHTML = '';
        currentWinDigits.forEach(num => {
            let ball = document.createElement('div');
            ball.className = 'win-ball';
            ball.innerText = num;
            ballsContainer.appendChild(ball);
        });

        document.getElementById('resultSection').style.display = 'block';
        document.getElementById('outputContainer').innerHTML = '';
        let defaultStats = 'ตรง 0 เลข โต๊ด 0 เลข';
        document.getElementById('statsInfo').innerText = defaultStats;
        localStorage.setItem('savedStatsInfo', defaultStats);
        localStorage.removeItem('savedOutputHTML');
    }

    function generateCombinations(digitCount, includeDub) {
        if (currentWinDigits.length === 0) return;

        let uniqueDirectCombinations = [];
        let totalTodCount = 0;

        if (digitCount === 2) {
            if (includeDub) {
                for (let i = 0; i < currentWinDigits.length; i++) {
                    for (let j = 0; j < currentWinDigits.length; j++) {
                        let d1 = currentWinDigits[i];
                        let d2 = currentWinDigits[j];
                        if (i <= j) {
                            uniqueDirectCombinations.push(`${d1}${d2}`);
                        }
                        totalTodCount += (d1 === d2 ? 1 : 2);
                    }
                }
            } else {
                for (let i = 0; i < currentWinDigits.length; i++) {
                    for (let j = i + 1; j < currentWinDigits.length; j++) {
                        let d1 = currentWinDigits[i];
                        let d2 = currentWinDigits[j];
                        uniqueDirectCombinations.push(`${d1}${d2}`);
                    }
                }
                totalTodCount = uniqueDirectCombinations.length * 2;
            }
        } else if (digitCount === 3) {
            if (includeDub) {
                let seenCanonical = new Set();
                
                for (let i = 0; i < currentWinDigits.length; i++) {
                    for (let j = 0; j < currentWinDigits.length; j++) {
                        for (let k = 0; k < currentWinDigits.length; k++) {
                            let d1 = currentWinDigits[i];
                            let d2 = currentWinDigits[j];
                            let d3 = currentWinDigits[k];

                            let sortedCombo = [d1, d2, d3].sort((a, b) => a - b).join('');
                            
                            if (!seenCanonical.has(sortedCombo)) {
                                seenCanonical.add(sortedCombo);
                                uniqueDirectCombinations.push(sortedCombo);
                            }
                        }
                    }
                }

                seenCanonical.forEach(combo => {
                    let a = parseInt(combo[0]);
                    let b = parseInt(combo[1]);
                    let c = parseInt(combo[2]);

                    if (a === b && b === c) {
                        totalTodCount += 1; 
                    } else if (a === b || b === c || a === c) {
                        totalTodCount += 3; 
                    } else {
                        totalTodCount += 6; 
                    }
                });

            } else {
                for (let i = 0; i < currentWinDigits.length; i++) {
                    for (let j = i + 1; j < currentWinDigits.length; j++) {
                        for (let k = j + 1; k < currentWinDigits.length; k++) {
                            let d1 = currentWinDigits[i];
                            let d2 = currentWinDigits[j];
                            let d3 = currentWinDigits[k];

                            uniqueDirectCombinations.push(`${d1}${d2}${d3}`);
                        }
                    }
                }
                totalTodCount = uniqueDirectCombinations.length * 6;
            }
        }

        let directCount = uniqueDirectCombinations.length;
        let statsText = `ตรง ${directCount} เลข โต๊ด ${totalTodCount} เลข`;
        document.getElementById('statsInfo').innerText = statsText;
        localStorage.setItem('savedStatsInfo', statsText);

        let lottoName = document.getElementById('lottoName').value || 'หวย';
        let today = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
        
        let titleText = `📌 ${lottoName} ประจำวันที่ ${today}\n🎯 วิน ${currentWinDigits.length} ตัว | จับ ${digitCount} ตัว (${includeDub ? 'รวมเบิ้ล' : 'ไม่รวมเบิ้ล'})`;
        let vipText = `🔥 เลขเด่น 2 ตัว: [ ${topTwoDigits} ]`;
        let statsTextShare = `📊 (ตรง ${directCount} เลข | โต๊ด ${totalTodCount} เลข)`;
        let contentText = uniqueDirectCombinations.join(', ');

        let finalShareText = `${titleText}\n${vipText}\n--------------------\n${contentText}\n--------------------\n${statsTextShare}`;

        let outputHTML = `
            <div class="card-output">
                <h4>
                    <span>${lottoName} (วิน ${currentWinDigits.length} ตัว / ${digitCount} ตัว${includeDub ? ' รวมเบิ้ล' : ''})</span>
                    <button class="btn-copy" onclick="copyToClipboard(this)">คัดลอก</button>
                </h4>
                <div class="output-box" id="shareContent">${finalShareText.replace(/\n/g, '<br>')}</div>
            </div>
        `;

        document.getElementById('outputContainer').innerHTML = outputHTML;
        localStorage.setItem('savedOutputHTML', outputHTML);
    }

    function clearData() {
        if(confirm('คุณต้องการล้างข้อมูลทั้งหมดใช่หรือไม่?')) {
            localStorage.clear();
            document.getElementById('lottoName').value = 'หวยหุ้นไทย';
            document.getElementById('inputData').value = '12345';
            document.getElementById('winCountSelect').value = '7';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('outputContainer').innerHTML = '';
            currentWinDigits = [];
            topTwoDigits = "";
            alert('ล้างข้อมูลเรียบร้อยแล้ว!');
        }
    }

    function copyToClipboard(button) {
        let box = button.parentElement.nextElementSibling;
        let textToCopy = box.innerText; 

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('คัดลอกข้อความสำเร็จ!');
            }).catch(err => {
                fallbackCopy(box, textToCopy);
            });
        } else {
            fallbackCopy(box, textToCopy);
        }
    }

    function fallbackCopy(box, textToCopy) {
        let range = document.createRange();
        range.selectNodeContents(box);
        let selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        try {
            document.execCommand('copy');
            alert('คัดลอกข้อความสำเร็จ!');
        } catch (err) {
            alert('กรุณากดคัดลอกข้อความในกล่องด้วยตนเอง');
        }
    }
</script>

</body>
</html>
