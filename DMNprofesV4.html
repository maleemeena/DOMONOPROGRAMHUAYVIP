<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ 💖 💰 โปรแกรมสูตรสถิติหวยอัจฉริยะ V8.4  💰 💖 ✨</title>
    <style>
        @keyframes glowBlink {
            0% { filter: drop-shadow(0 0 2px #ff80ab) drop-shadow(0 0 10px #ff4081); transform: scale(1); }
            50% { filter: drop-shadow(0 0 8px #40c4ff) drop-shadow(0 0 20px #00b0ff); transform: scale(1.01); }
            100% { filter: drop-shadow(0 0 2px #ffab40) drop-shadow(0 0 10px #ff9100); transform: scale(1); }
        }

        /* เอฟเฟกต์วิบวับสำหรับ 3 อันดับแรกสุด */
        @keyframes superGlow {
            0% { transform: scale(1); box-shadow: 0 0 5px #ff4081, inset 0 0 3px #fff; background: #ffebee; }
            50% { transform: scale(1.08); box-shadow: 0 0 15px #00b0ff, inset 0 0 8px #ffeb3b; background: #e0f7fa; }
            100% { transform: scale(1); box-shadow: 0 0 5px #ff9100, inset 0 0 3px #fff; background: #fff3e0; }
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(135deg, #fff0f5, #e0f7fa, #fff3e0); 
            margin: 0; 
            padding: 10px; 
            color: #4a3b5c; 
            font-size: 14px; 
        }
        .header { 
            background: linear-gradient(135deg, #ff4081, #ff9100, #00b0ff); 
            color: #ffffff; 
            text-align: center; 
            padding: 16px; 
            font-size: 17px; 
            font-weight: bold; 
            border-radius: 12px; 
            box-shadow: 0 6px 15px rgba(255, 64, 129, 0.3); 
            animation: glowBlink 2s infinite alternate;
        }
        .user-info-box {
            background: #ffffff !important;
            border: 2px solid #ff80ab !important;
            border-radius: 10px !important;
            margin-top: 10px;
            margin-bottom: 12px; 
            padding: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 10px;
            box-shadow: 0 3px 10px rgba(255, 128, 171, 0.15);
        }
        .input-container { position: relative; width: 100%; margin-top: 8px; }
        textarea { 
            width: 100%; 
            height: 110px; 
            padding: 10px; 
            padding-bottom: 35px; 
            box-sizing: border-box; 
            font-family: monospace; 
            font-size: 14px; 
            border: 2px solid #ff80ab; 
            border-radius: 10px; 
            resize: vertical; 
            background: #ffffff;
        }
        textarea:focus {
            outline: none;
            border-color: #00b0ff;
            box-shadow: 0 0 0 3px rgba(0, 176, 255, 0.2);
        }
        .btn-clear { 
            position: absolute; 
            bottom: 8px; 
            right: 8px; 
            background: #ffebee; 
            color: #c62828; 
            border: 1px solid #ffcdd2; 
            padding: 5px 12px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn-clear:hover { background: #ffcdd2; }
        
        /* สไตล์กล่องสรุปผลรวม (พับเก็บได้) */
        .summary-box {
            background: #ffffff;
            border: 2.5px solid #ff9100;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 4px 15px rgba(255, 145, 0, 0.2);
        }
        .summary-title {
            font-weight: bold;
            color: #d84315;
            font-size: 15px;
            margin-bottom: 0px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .summary-title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .summary-content {
            font-size: 13.5px;
            line-height: 1.6;
            color: #3e2723;
            margin-top: 10px;
            border-top: 2px dashed #ffe0b2;
            padding-top: 8px;
            transition: all 0.3s ease;
        }
        .badge-num {
            background: #fff3e0;
            border: 1px solid #ffb74d;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: bold;
            color: #e65100;
            display: inline-block;
            margin: 3px;
        }
        /* เลขวิบวับ 3 อันดับแรก */
        .badge-glow {
            animation: superGlow 1.5s infinite alternate;
            border: 2px solid #ff4081;
            color: #ad1457;
            font-weight: 900;
            font-size: 14px;
        }
        .btn-action-group {
            display: flex;
            gap: 6px;
        }
        .btn-copy-sm {
            background: #e0f7fa; 
            border: 1px solid #80d8ff; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: bold; 
            color: #0277bd; 
            cursor: pointer;
        }
        .btn-copy-sm:hover { background: #b2ebf2; }
        .btn-collapse {
            background: #fff3e0;
            border: 1px solid #ff9100;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            color: #e65100;
            cursor: pointer;
        }
        .btn-collapse:hover { background: #ffe0b2; }

        .filter-bar { 
            background: #ffffff; 
            padding: 14px; 
            border-radius: 10px; 
            margin: 10px 0; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border: 2px solid #80d8ff;
            box-shadow: 0 4px 10px rgba(128, 216, 255, 0.15);
        }
        .f-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .f-lbl { font-weight: bold; color: #ff4081; min-width: 75px; font-size: 13px; }
        
        select { 
            padding: 10px; 
            border-radius: 8px; 
            border: 2px solid #ff9100; 
            font-size: 14px; 
            width: 100%; 
            font-weight: bold; 
            color: #d84315; 
            background: #fff3e0; 
        }
        
        .btn { 
            background: #ffffff; 
            border: 1.5px solid #ff80ab; 
            padding: 6px 14px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 500; 
            color: #ad1457;
            transition: all 0.2s;
        }
        .btn.active { 
            background: linear-gradient(135deg, #ff4081, #ff9100); 
            color: #fff; 
            border-color: transparent; 
            box-shadow: 0 3px 8px rgba(255, 64, 129, 0.3);
        }
        
        .btn-ai {
            background: linear-gradient(135deg, #ff4081, #ff9100, #00b0ff);
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-ai:active { opacity: 0.9; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
        .card { 
            background: #ffffff; 
            padding: 14px; 
            border-radius: 12px; 
            box-shadow: 0 4px 12px rgba(255, 145, 0, 0.15); 
            border-top: 6px solid #ff4081; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border-left: 2px solid #ff80ab;
            border-right: 2px solid #80d8ff;
            border-bottom: 2px solid #ffe0b2;
        }
        .c-head { 
            display: flex; 
            justify-content: space-between; 
            font-weight: bold; 
            border-bottom: 2px dashed #ffe0b2; 
            padding-bottom: 8px; 
            font-size: 13px; 
            color: #d84315;
        }
        .box { position: relative; margin-top: 8px; }
        .list { 
            font-family: monospace; 
            height: 180px; 
            overflow-y: auto; 
            background: #fff8e1; 
            padding: 8px; 
            border: 1.5px solid #ffe0b2; 
            border-radius: 8px; 
            white-space: pre-wrap; 
            font-size: 13px; 
            line-height: 1.5; 
            color: #3e2723;
        }
        .btn-copy { 
            position: absolute; 
            top: 5px; 
            right: 5px; 
            font-size: 11px; 
            padding: 4px 10px; 
            cursor: pointer; 
            background: #e0f7fa; 
            border: 1px solid #80d8ff; 
            border-radius: 6px; 
            font-weight: bold; 
            color: #0277bd; 
        }
        .btn-copy:hover { background: #b2ebf2; }
        .next { 
            margin-top: 10px; 
            text-align: center; 
            color: #c2185b; 
            font-weight: bold; 
            font-size: 14px; 
            background: #fce4ec; 
            padding: 8px; 
            border-radius: 8px; 
            border: 1.5px solid #f8bbd0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        /* สไตล์ป้ายรอบถัดไปวิบวับในการ์ด 3 อันดับแรก */
        .next-glow {
            animation: superGlow 1.5s infinite alternate;
            background: #ffebee !important;
            border: 2px solid #ff4081 !important;
            color: #ad1457 !important;
        }
    </style>
</head>
<body>

<div class="header" id="h">✨ 💖 💰 โปรแกรมสูตรสถิติหวยอัจฉริยะ V8.4 💰 💖 ✨</div>
<div class="user-info-box">
    <label style="margin: 0; font-weight: bold; color: #ff4081;">
        🌸 📌 ชื่อหวย: 
        <input type="text" id="lotteryName" oninput="saveAndCalc()" placeholder="เช่น หวยรัฐบาล, หวยลาว" style="padding: 6px; border: 1.5px solid #ff80ab; border-radius: 6px; background: #fff0f5;">
    </label>
    <div style="font-weight: bold; color: #333; background: #e0f7fa; padding: 6px 12px; border-radius: 6px; border: 1.5px solid #80d8ff;">
        📞 💬 LINE: <span style="color: #0288d1;">momongmo</span> 💰
    </div>
</div>
<div class="input-container">
    <textarea id="inp" oninput="saveAndCalc()" placeholder="💖 วางผลสถิติหวยลาว ยี่กี ฯลฯ ได้ทุกรูปแบบ... 💰"></textarea>
    <button class="btn-clear" onclick="clearData()">ล้างข้อมูล 🧹</button> 
</div>

<!-- กล่องสรุปผลรวม (พับเก็บได้ + เลขวิบวับ 3 อันดับแรก) -->
<div class="summary-box" id="summaryBoxContainer" style="display:none;">
    <div class="summary-title" onclick="toggleSummaryBox()">
        <div class="summary-title-left">
            <span>🔥 📊 สรุปความถี่และเปอร์เซ็นต์เลขเด่นจากทั้ง 10 ชุด (รอบถัดไป)</span>
        </div>
        <div class="btn-action-group" onclick="event.stopPropagation()">
            <button class="btn-copy-sm" onclick="copyAllSummary()">คัดลอกทั้งหมด 📋</button>
            <button class="btn-collapse" id="collapseBtn" onclick="toggleSummaryBox()">พับเก็บ 🔼</button>
        </div>
    </div>
    <div class="summary-content" id="summaryContentText">
        กำลังประมวลผล...
    </div>
    <textarea id="allSummaryRaw" style="display:none;"></textarea>
</div>

<div class="filter-bar">
    <div class="f-row">
        <span class="f-lbl">🎯 เลือกแนวทาง:</span>
        <select id="sel" onchange="saveAndCalc()"></select> 
    </div>
    
    <div class="f-row">
        <button class="btn-ai" onclick="aiSmartScan()">🤖✨ AI สแกนสูตร  💰🎉</button>
    </div>

    <div class="f-row">
        <span class="f-lbl">📊 จำนวนรอบ:</span>
        <button class="btn active r-btn" onclick="setL(0,this)">ผลทั้งหมด</button>
        <button class="btn r-btn" onclick="setL(3,this)">ผล 3 รอบ</button>
        <button class="btn r-btn" onclick="setL(4,this)">ผล 4 รอบ</button>
        <button class="btn r-btn" onclick="setL(5,this)">ผล 5 รอบ</button>
    </div>
</div>

<div class="grid" id="out"></div>

<script>
let lim = 0;
let customRootDegrees = [1.2, 1.3, 1.4, 1.5, 1.7, 2, 3, 3.9, 2.9, 5.4];
let isSummaryCollapsed = false;

function toggleSummaryBox() {
    let content = document.getElementById('summaryContentText');
    let btn = document.getElementById('collapseBtn');
    isSummaryCollapsed = !isSummaryCollapsed;
    if (isSummaryCollapsed) {
        content.style.display = 'none';
        btn.textContent = 'ขยาย 🔽';
    } else {
        content.style.display = 'block';
        btn.textContent = 'พับเก็บ 🔼';
    }
}

function initMenu() {
    const s = document.getElementById('sel');
    s.innerHTML = ""; 
    
    const makeGroup = (lbl, arr) => {
        let g = document.createElement('optgroup'); g.label = lbl;
        arr.forEach(i => {
            let o = document.createElement('option');
            let name = Array.isArray(i) ? i[0] : i;
            let mode = Array.isArray(i) ? i[1] : "top_2d";
            let len = Array.isArray(i) ? i[2] : 4;
            let type = Array.isArray(i) ? (i[3] || "ปกติ") : "ปกติ";
            
            o.value = `${name}|${mode}|${len}|${type}`; 
            o.textContent = name;
            g.appendChild(o);
        });
        s.appendChild(g);
    };

    makeGroup("—— 💖 พิกัด / วิ่ง / รูด VIP 💖 ——", [
        ["พิกัด 1 ตัว","top_2d",1], ["พิกัด 2 ตัว","top_2d",2], ["พิกัดบน 3 ตัว","top_2d",3], ["พิกัดบน 4 ตัว","top_2d",4],
        ["พิกัดล่าง 3 ตัว","bot_2d",3], ["พิกัดล่าง 4 ตัว","bot_2d",4], ["พิกัดวินบน-ล่าง","both_2d",7],
        ["วิ่งบนล่าง 1 ตัว","both_2d",1], ["วิ่งบนล่าง 2 ตัว","both_all",2], ["วิ่งบน 1 ตัว","top_2d",1], ["วิ่งล่าง 1 ตัว","bot_2d",1],
        ["รูดตัวเดียว (บนล่าง)","both_2d",1], ["รูด 2 ตัว (บนล่าง)","both_all",2], ["รูดบน 2 ตัว","top_2d",2], ["รูดล่าง 2 ตัว","bot_2d",2]
    ]);

    makeGroup("—— 🍊 เลขวิน VIP  🍊 ——", [
        ["วินบน 5 ตัว","win_top_2d",5], ["วินบน 6 ตัว","win_top_2d",6], ["วินบน 7 ตัว","win_top_2d",7], ["วินบน 8 ตัว","win_top_2d",8], ["วินบน 9 ตัว","win_top_2d",9],
        ["วินล่าง 5 ตัว","win_bot_2d",5], ["วินล่าง 6 ตัว","win_bot_2d",6], ["วินล่าง 7 ตัว","win_bot_2d",7], ["วินล่าง 8 ตัว","win_bot_2d",8], ["วินล่าง 9 ตัว","win_bot_2d",9],
        ["วินบนล่าง 5 ตัว","win_both_2d",5], ["วินบนล่าง 6 ตัว","win_both_2d",6], ["วินบนล่าง 7 ตัว","win_both_2d",7], ["วินบนล่าง 8 ตัว","win_both_2d",8], ["วินบนล่าง 9 ตัว","win_both_2d",9]
    ]);

    makeGroup("—— 🎯 คู่ / คี่ แยกรายหลัก  🎯 ——", [
        ["คู่ ร้อย", "roi", 5, "odd_even"], 
        ["คู่ สิบบน", "sib_top", 5, "odd_even"], 
        ["คู่ หน่วยบน", "noi_top", 5, "odd_even"], 
        ["คู่ สิบล่าง", "sib_bot", 5, "odd_even"], 
        ["คู่ หน่วยล่าง", "noi_bot", 5, "odd_even"],
        ["คี่ ร้อย", "roi", 5, "odd_even"], 
        ["คี่ สิบบน", "sib_top", 5, "odd_even"], 
        ["คี่ หน่วยบน", "noi_top", 5, "odd_even"], 
        ["คี่ สิบล่าง", "sib_bot", 5, "odd_even"], 
        ["คี่ หน่วยล่าง", "noi_bot", 5, "odd_even"]
    ]);

    makeGroup("—— 🎯 สูง / ต่ำ แยกรายหลัก  🎯 ——", [
        ["สูง ร้อย", "roi", 5, "high_low"], 
        ["สูง สิบบน", "sib_top", 5, "high_low"], 
        ["สูง หน่วยบน", "noi_top", 5, "high_low"], 
        ["สูง สิบล่าง", "sib_bot", 5, "high_low"], 
        ["สูง หน่วยล่าง", "noi_bot", 5, "high_low"],
        ["ต่ำ ร้อย", "roi", 5, "high_low"], 
        ["ต่ำ สิบบน", "sib_top", 5, "high_low"], 
        ["ต่ำ หน่วยบน", "noi_top", 5, "high_low"], 
        ["ต่ำ สิบล่าง", "sib_bot", 5, "high_low"], 
        ["ต่ำ หน่วยล่าง", "noi_bot", 5, "high_low"]
    ]);

    let p = [];
    for(let n=5; n<=9; n++) p.push([`ปักสิบบน ${n} ตัว`,"p_sib_top",n]);
    for(let n=5; n<=9; n++) p.push([`ปักหน่วยบน ${n} ตัว`,"p_noi_top",n]);
    for(let n=5; n<=9; n++) p.push([`ปักสิบล่าง ${n} ตัว`,"p_sib_bot",n]); 
    for(let n=5; n<=9; n++) p.push([`ปักหน่วยล่าง ${n} ตัว`,"p_noi_bot",n]); 
    for(let n=5; n<=9; n++) p.push([`ปักหลักร้อย ${n} ตัว`,"p_roi",n]);
    makeGroup("—— 💙 ปักหลัก VIP 💙 ——", p);

    let fx = [["คงที่วิ่งบนล่าง 2 ตัว","both_2d",2],["คงที่วิ่งบน 2 ตัว","top_2d",2],["คงที่วิ่งล่าง 2 ตัว","bot_2d",2],["คงที่ 2 ตัว","both_2d",2],["คงที่บน 2 ตัว","top_2d",2],["คงที่บน 3 ตัว","top_2d",3],["คงที่บน 4 ตัว","top_2d",4],["คงที่ล่าง 2 ตัว","bot_2d",2],["คงที่ล่าง 3 ตัว","bot_2d",3],["คงที่ล่าง 4 ตัว","bot_2d",4]];
    for(let n=5; n<=9; n++) { fx.push([`คงที่วินบน ${n} ตัว`,"win_top_2d",n]); fx.push([`คงที่วินล่าง ${n} ตัว`,"win_bot_2d",n]); }
    
    makeGroup("—— ✨ เลขคงที่ VIP ✨ ——", fx);
    makeGroup("—— 💰 แนวทางจับทางเลข VIP 💰 ——",[["จับหลักร้อย (หาเลขเดินดี)","p_roi",1,"จับทาง"],["จับหลักสิบบบน (หาเลขเดินดี)","p_sib_top",1,"จับทาง"],["จับหลักหน่วยบน (หาเลขเดินดี)","p_noi_top",1,"จับทาง"]]);
}

function setL(l, b) { lim = l; document.querySelectorAll('.r-btn').forEach(i => i.classList.remove('active')); b.classList.add('active'); saveAndCalc(); }

function aiSmartScan() {
    let txt = document.getElementById('inp').value.trim();
    if (!txt) {
        alert("💖 กรุณาวางผลสถิติก่อนใช้งาน AI สแกนสูตรจ้า! 💰");
        return;
    }
    customRootDegrees = [];
    for(let i=0; i<10; i++) {
        let randVal = Math.random() * (999.99 - 0.1) + 0.1;
        customRootDegrees.push(parseFloat(randVal.toFixed(2)));
    }
    calc();
    alert(`✨🎉 AI สแกนหาสูตร  สำเร็จปังปุริเย่! 💰 เฮงๆ รวยๆ รับทรัพย์จ้า! 🌸`);
}

function saveAndCalc() {
    localStorage.setItem('saved_lottery_data', document.getElementById('inp').value);
    localStorage.setItem('saved_lottery_formula', document.getElementById('sel').value);
    if(document.getElementById('lotteryName')) {
        localStorage.setItem('saved_lottery_title_name', document.getElementById('lotteryName').value);
    }
    calc();
}

function clearData() {
    if(confirm("💖 คุณต้องการล้างข้อมูลสถิติที่พิมพ์ไว้ทั้งหมดใช่หรือไม่? 🧹")) {
        document.getElementById('inp').value = "";
        localStorage.removeItem('saved_lottery_data');
        calc();
    }
}

function generateFrequencySortedDigits(baseVal, rootDegree, length) {
    let val = Math.abs(parseFloat(baseVal));
    if(val === 0) val = 123.45;

    let degree = parseFloat(rootDegree);
    if(degree <= 0) degree = 1.23;
    let rootResult = Math.pow(val, 1 / degree);

    let strNum = rootResult.toFixed(12).replace('.', '');

    let freqMap = {};
    for(let i = 0; i <= 9; i++) freqMap[String(i)] = 0;

    for(let char of strNum) {
        if(freqMap[char] !== undefined) freqMap[char]++;
    }

    let sortedDigits = Object.keys(freqMap).sort((a, b) => freqMap[b] - freqMap[a]);
    let finalDigits = [];
    for(let d of sortedDigits) {
        if(!finalDigits.includes(d)) finalDigits.push(d);
    }
    for(let i = 0; i <= 9; i++) {
        let sNum = String(i);
        if(!finalDigits.includes(sNum)) finalDigits.push(sNum);
    }
    return finalDigits.slice(0, length);
}

function processCombinedFrequency(formulasList) {
    let twoDigitCounts = {};
    let threeDigitCounts = {};
    let totalSets = formulasList.length;

    formulasList.forEach(item => {
        let numStr = item.formula;
        if (!numStr || numStr.length < 2) return;
        let digits = numStr.split('');
        let unique2D = new Set();
        let unique3D = new Set();

        for(let i = 0; i < digits.length; i++) {
            for(let j = i + 1; j < digits.length; j++) {
                let pair = [digits[i], digits[j]].sort().join('');
                unique2D.add(pair);
            }
        }

        for(let i = 0; i < digits.length; i++) {
            for(let j = i + 1; j < digits.length; j++) {
                for(let k = j + 1; k < digits.length; k++) {
                    let trio = [digits[i], digits[j], digits[k]].sort().join('');
                    unique3D.add(trio);
                }
            }
        }

        unique2D.forEach(pair => {
            twoDigitCounts[pair] = (twoDigitCounts[pair] || 0) + 1;
        });
        unique3D.forEach(trio => {
            threeDigitCounts[trio] = (threeDigitCounts[trio] || 0) + 1;
        });
    });

    let sorted2D = Object.entries(twoDigitCounts).sort((a, b) => b[1] - a[1]);
    let sorted3D = Object.entries(threeDigitCounts).sort((a, b) => b[1] - a[1]);

    return { sorted2D, sorted3D, totalSets };
}

function calc() {
    let txt = document.getElementById('inp').value.trim(); 
    if (!txt) { 
        document.getElementById('out').innerHTML = ''; 
        document.getElementById('summaryBoxContainer').style.display = 'none';
        return; 
    }
    
    let [tName, mode, lenStr, type] = document.getElementById('sel').value.split('|');
    let length = parseInt(lenStr) || 4;
    
    let headerTitle = `${tName} - (แสดงผล 10 การ์ด)`;
    document.getElementById('h').textContent = `✨ 💖 💰 ${headerTitle} 💰 💖 ✨`;
    
    let userLottery = document.getElementById('lotteryName') ? document.getElementById('lotteryName').value.trim() : '';
    let permanentLine = "momongmo";

    let customHeader = "";
    if (userLottery) customHeader += `🌸 📌 หวย: ${userLottery}\n`;
    customHeader += `💰 💬 ติดต่อ LINE: ${permanentLine} 💸\n`;
    customHeader += `-------------------\n`;

    let lines = txt.split('\n'), parsed = [], rCount = 1, title = "สถิติหวย";
    for (let i = 0; i < Math.min(3, lines.length); i++) {
        if (lines[i].trim() && !lines[i].includes('-') && !lines[i].includes('➡️') && !lines[i].includes('=')) { title = lines[i].trim(); break; }
    }
    
    lines.forEach(l => {
        if (!l.trim()) return;
        let cleanLine = l.replace(/[|➡️\—\=\-|]/g, ' ');
        let m = cleanLine.match(/(\d{3,4})\s+(\d{2})/);
        
        if (m) {
            let lbl = "งวด " + rCount++;
            let dateMatch = l.match(/(\d{1,2}\s+[ก-์a-zA-Z.]+\s+\d{2,4})/);
            let roundMatch = l.match(/^[^0-9]*(\d+)[:.\s]/);
            
            if (dateMatch) lbl = dateMatch[1];
            else if (roundMatch) lbl = "รอบ " + roundMatch[1];
            
            let topPrize = m[1];
            if (topPrize.length === 4) topPrize = topPrize.slice(-3);
            let bottomPrize = m[2];
            
            parsed.push({ r: lbl, top: topPrize, bot: bottomPrize });
        }
    });

    let dLines = lim > 0 ? parsed.slice(-lim) : parsed;
    let g = document.getElementById('out'); 
    g.innerHTML = '';

    let resultsArray = [];
    let summaryFormulasList = [];

    if (type === "odd_even" || type === "high_low") {
        let isEvenTarget = tName.includes("คู่");
        let isHighTarget = tName.includes("สูง");
        let prefixText = isEvenTarget ? "คู่" : (tName.includes("คี่") ? "คี่" : (isHighTarget ? "สูง" : "ต่ำ"));
        
        let subTargets = [
            { name: `${prefixText} ร้อย`, mode: "roi" },
            { name: `${prefixText} สิบบน`, mode: "sib_top" },
            { name: `${prefixText} หน่วยบน`, mode: "noi_top" },
            { name: `${prefixText} สิบล่าง`, mode: "sib_bot" },
            { name: `${prefixText} หน่วยล่าง`, mode: "noi_bot" },
            { name: `${prefixText} ร้อย (เสริมที่ 2)`, mode: "roi" },
            { name: `${prefixText} สิบบน (เสริมที่ 2)`, mode: "sib_top" },
            { name: `${prefixText} หน่วยบน (เสริมที่ 2)`, mode: "noi_top" },
            { name: `${prefixText} สิบล่าง (เสริมที่ 2)`, mode: "sib_bot" },
            { name: `${prefixText} หน่วยล่าง (เสริมที่ 2)`, mode: "noi_bot" }
        ];

        subTargets.forEach((subT, sId) => {
            let win = 0, html = '', subLast = '';
            dLines.forEach((item) => {
                subLast = item.r;
                let top3d = item.top;
                let top2d = item.top.slice(-2);
                let bot2d = item.bot;

                let targetVal = "";
                if (subT.mode === "roi") targetVal = top3d.charAt(0);
                else if (subT.mode === "sib_top") targetVal = top2d.charAt(0);
                else if (subT.mode === "noi_top") targetVal = top2d.charAt(1);
                else if (subT.mode === "sib_bot") targetVal = bot2d.charAt(0);
                else if (subT.mode === "noi_bot") targetVal = bot2d.charAt(1);

                let nVal = parseInt(targetVal) || 0;
                let isMatch = false;

                if (type === "odd_even") {
                    let isEven = (nVal % 2 === 0);
                    isMatch = (isEven === isEvenTarget);
                } else {
                    let isHigh = (nVal >= 5);
                    isMatch = (isHigh === isHighTarget);
                }

                if (isMatch) { win++; html += `${item.r} = ✅\n`; } 
                else { html += `${item.r} = ❌\n`; }
            });

            let rate = dLines.length > 0 ? parseFloat(((win / dLines.length) * 100).toFixed(1)) : 0;
            summaryFormulasList.push({ setId: sId + 1, formulaName: subT.name, formula: "01234", rate: rate, degree: "หลักสูตร" });

            resultsArray.push({
                id: sId + 1,
                name: `${subT.name}`,
                win: win,
                total: dLines.length,
                rate: rate,
                html: html,
                raw: `${customHeader}${title}\nแนวทาง: ${subT.name}\nถูก/ผิด = ${win}/${dLines.length - win} (${rate}%)\n\n${html}`,
                groupStr: "หลักสูตร",
                isFormulaGroup: false
            });
        });

    } else {
        for (let sId = 0; sId < 10; sId++) {
            let subWin = 0, subHtml = '', subRaw = '', subLast = '';
            let specificDegree = customRootDegrees[sId];

            dLines.forEach((subItem, subIdx) => {
                subLast = subItem.r;
                let currentFormulaDigits = [];

                if (subIdx === 0) {
                    let baseVal = parseFloat(subItem.top + "." + subItem.bot) * (sId + 1.15);
                    currentFormulaDigits = generateFrequencySortedDigits(baseVal, specificDegree, length);
                } else {
                    let prevTop = dLines[subIdx - 1].top;
                    let prevBot = dLines[subIdx - 1].bot;
                    let baseVal = parseFloat(prevTop + "." + prevBot) * ((sId + 1) * 2.2);
                    currentFormulaDigits = generateFrequencySortedDigits(baseVal, specificDegree, length);
                }

                let formulaStr = currentFormulaDigits.join('');
                let checkDigits = [...new Set(currentFormulaDigits)];
                let isWin = false, matchCount = 0, is3dWin = false;

                let top2dSub = subItem.top.slice(-2);
                let bot2dSub = subItem.bot;
                let top3dSub = subItem.top;

                if (tName.includes("วินบนล่าง")) {
                    let topMatch = checkDigits.includes(top2dSub.charAt(0)) && checkDigits.includes(top2dSub.charAt(1));
                    let botMatch = checkDigits.includes(bot2dSub.charAt(0)) && checkDigits.includes(bot2dSub.charAt(1));
                    let d3_1 = checkDigits.includes(top3dSub.charAt(0));
                    let d3_2 = checkDigits.includes(top3dSub.charAt(1));
                    let d3_3 = checkDigits.includes(top3dSub.charAt(2));
                    if (d3_1 && d3_2 && d3_3) is3dWin = true;
                    if (topMatch || botMatch) isWin = true;
                } else if (tName.includes("วิน")) {
                    let targetNum = mode.includes("bot") ? bot2dSub : top2dSub;
                    let c1 = checkDigits.includes(targetNum.charAt(0)); 
                    let c2 = checkDigits.includes(targetNum.charAt(1)); 
                    let d3_1 = checkDigits.includes(top3dSub.charAt(0));
                    let d3_2 = checkDigits.includes(top3dSub.charAt(1));
                    let d3_3 = checkDigits.includes(top3dSub.charAt(2));
                    if (d3_1 && d3_2 && d3_3) is3dWin = true;
                    if (c1 && c2) { isWin = true; matchCount = 2; }
                } else {
                    let targetNumStr = "";
                    let isBottomFormula = tName.includes("ล่าง") || mode.includes("bot");
                    if (tName.includes("ปักสิบ")) {
                        targetNumStr = isBottomFormula ? bot2dSub.charAt(0) : top2dSub.charAt(0);
                    } else if (tName.includes("ปักหน่วย")) {
                        targetNumStr = isBottomFormula ? bot2dSub.charAt(1) : subItem.top.slice(-1);
                    } else if (tName.includes("หลักร้อย")) {
                        targetNumStr = subItem.top.charAt(0);
                    } else {
                        targetNumStr = isBottomFormula ? bot2dSub : top2dSub;
                    }

                    for(let ch of targetNumStr) {
                        if(checkDigits.includes(ch)) matchCount++;
                    }
                    if(matchCount > 0) isWin = true;
                }

                let sign = '❌';
                if (isWin || is3dWin) {
                    isWin = true;
                    subWin++;
                    if (tName.includes("วินบนล่าง")) {
                        let topMatch = checkDigits.includes(top2dSub.charAt(0)) && checkDigits.includes(top2dSub.charAt(1));
                        let botMatch = checkDigits.includes(bot2dSub.charAt(0)) && checkDigits.includes(bot2dSub.charAt(1));
                        if (topMatch && botMatch && is3dWin) sign = `✅✅❤️`; 
                        else if (is3dWin) sign = `✅❤️`;     
                        else if (topMatch && botMatch) sign = `✅✅`;     
                        else sign = `✅`;       
                    } else {
                        if (is3dWin) sign = `✅❤️`;
                        else sign = matchCount > 1 ? `✅(${matchCount})` : `✅`;
                    }
                }

                subHtml += `${subItem.r} = [${formulaStr}] = ${subItem.top} - ${subItem.bot} = ${sign}\n`;
                subRaw += `${subItem.r} = [${formulaStr}] = ${subItem.top} - ${subItem.bot} = ${sign}\n`;
            });

            let subRate = dLines.length > 0 ? parseFloat(((subWin / dLines.length) * 100).toFixed(1)) : 0;
            let lastFormula = "";
            if (dLines.length > 0) {
                let lastIdx = dLines.length - 1;
                let prevTop = dLines[lastIdx].top;
                let prevBot = dLines[lastIdx].bot;
                let baseVal = parseFloat(prevTop + "." + prevBot) * ((sId + 1) * 2.2);
                let lastDigits = generateFrequencySortedDigits(baseVal, specificDegree, length);
                lastFormula = lastDigits.join('');
            }

            summaryFormulasList.push({ 
                setId: sId + 1, 
                formulaName: `ชุดที่ ${sId + 1} (สูตรที่ ${specificDegree})`, 
                formula: lastFormula, 
                rate: subRate,
                degree: specificDegree
            });

            resultsArray.push({
                id: sId + 1,
                name: `ชุดที่ ${sId + 1} (สูตรที่ ${specificDegree})`,
                win: subWin,
                total: dLines.length,
                rate: subRate,
                html: subHtml,
                raw: `${customHeader}${title}\nแนวทาง: ${tName} (สูตรที่ ${specificDegree})\nสูตรชุดที่ ${sId + 1} [${lastFormula}]\nถูก/ผิด = ${subWin}/${dLines.length - subWin} (${subRate}%)\n\n${subHtml}\n`,
                groupStr: `[${lastFormula}]`,
                isFormulaGroup: true,
                originalSetId: sId + 1
            });
        }
    }

    // จัดเรียงลำดับการ์ดและรายการสรุปตาม % ความแม่นยำ จากมากไปน้อย
    summaryFormulasList.sort((a, b) => b.rate - a.rate || a.setId - b.setId);
    resultsArray.sort((a, b) => b.rate - a.rate || (a.id || 0) - (b.id || 0));

    // สร้างกล่องสรุปผลรวมด้านบน
    if (summaryFormulasList.length > 0 && type !== "odd_even" && type !== "high_low") {
        let freqData = processCombinedFrequency(summaryFormulasList);
        let latestDateStr = dLines.length > 0 ? dLines[dLines.length - 1].r : "รอบล่าสุด";
        
        let html10Sets = "";
        let rawTextList = `🔥 📊 สรุปความถี่และเปอร์เซ็นต์เลขเด่นจากทั้ง 10 ชุด (${userLottery || 'หวย'} | ${tName} | ${latestDateStr})\n-------------------\n`;

        summaryFormulasList.forEach((item, idx) => {
            let isTop3 = idx < 3;
            let itemStyle = isTop3 ? "font-weight: bold; color: #ad1457;" : "";
            html10Sets += `<div style="${itemStyle}">• <b>ชุดที่ ${item.setId}</b> สูตรที่ = ${item.formula} (${item.rate}%)</div>`;
            rawTextList += `ชุดที่ ${item.setId} สูตรที่ = ${item.formula} (${item.rate}%)\n`;
        });

        let html2D = "";
        let raw2DText = "\n🔹 เลข 2 ตัวเด่นสุด :\n";
        freqData.sorted2D.slice(0, 8).forEach(([num, count], idx) => {
            let pct = Math.round((count / freqData.totalSets) * 100);
            let badgeClass = idx < 3 ? "badge-num badge-glow" : "badge-num";
            html2D += `<span class="${badgeClass}">${num} (${pct}%)</span> `;
            raw2DText += `${num} (${pct}%) `;
        });

        let html3D = "";
        let raw3DText = "\n🔹 เลข 3 ตัวเด่นสุด :\n";
        freqData.sorted3D.slice(0, 8).forEach(([num, count], idx) => {
            let pct = Math.round((count / freqData.totalSets) * 100);
            let badgeClass = idx < 3 ? "badge-num badge-glow" : "badge-num";
            html3D += `<span class="${badgeClass}">${num} (${pct}%)</span> `;
            raw3DText += `${num} (${pct}%) `;
        });

        rawTextList += raw2DText + "\n" + raw3DText;

        document.getElementById('summaryContentText').innerHTML = `
            <div style="margin-bottom: 6px; color: #ad1457; font-weight: bold;">🎯 แนวทาง: ${tName} | 📅 งวดล่าสุด: ${latestDateStr}</div>
            <div style="margin-bottom: 8px;"><b>📋 รายการเลขรอบถัดไปทั้ง 10 ชุด:</b><div style="margin-top: 4px;">${html10Sets}</div></div>
            <hr style="border: 0; border-top: 1px dashed #ffe0b2; margin: 8px 0;">
            <div style="margin-bottom: 6px;"><b>🔹 เลข 2 ตัวเด่นสุด :</b><br>${html2D || '-'}</div>
            <div><b>🔹 เลข 3 ตัวเด่นสุด (ชนบ่อยจาก 10 ชุด):</b><br>${html3D || '-'}</div>
        `;
        document.getElementById('allSummaryRaw').value = rawTextList;
        document.getElementById('summaryBoxContainer').style.display = 'block';
    } else {
        document.getElementById('summaryBoxContainer').style.display = 'none';
    }

    // แสดงการ์ดในกริดครบทั้ง 10 การ์ด โดย 3 อันดับแรกในตารางจะกระพริบวิบวับตามเกณฑ์ (%)
    resultsArray.forEach((item, index) => {
        let cardId = item.id ? item.id : `target_${index}`;
        let d = document.createElement('div'); 
        d.className = 'card';
        let headTitle = `✨ 💰 [${item.groupStr.replace(/[\[\]]/g, '')}] - ${item.name}`;
        
        let isTop3Card = index < 3;
        let nextClass = isTop3Card ? "next next-glow" : "next";
        let nextText = `💰 รอบถัดไป/แนวทาง = ${item.groupStr} 💸`;

        d.innerHTML = `
            <div class="c-head">
                <div>${headTitle}</div>
                <div>ถูก/ผิด=${item.win}/${item.total-item.win}=${item.rate}%</div>
            </div>
            <div class="box">
                <button class="btn-copy" onclick="cp('${cardId}')">คัดลอก</button>
                <div class="list">${item.html}</div>
                <textarea id="raw-${cardId}" style="display:none">${item.raw}</textarea>
            </div>
            <div class="${nextClass}">${nextText}</div>
        `;
        g.appendChild(d);
    });
}
    
function copyAllSummary() {
    let ta = document.getElementById('allSummaryRaw');
    if (!ta || !ta.value) return;
    ta.style.display = "block"; 
    ta.select(); 
    ta.setSelectionRange(0, 99999);
    try { 
        document.execCommand('copy'); 
        alert("💖 คัดลอกสรุปรายการ 10 ชุดและความถี่ทั้งหมดสำเร็จแล้วจ้า! 💰🎉"); 
    } catch (err) { 
        navigator.clipboard.writeText(ta.value).then(() => alert("💖 คัดลอกสำเร็จ! 💰")); 
    }
    ta.style.display = "none";
}

function cp(id) {
    let ta = document.getElementById(`raw-${id}`);
    if (!ta) return;
    ta.style.display = "block"; 
    ta.select(); 
    ta.setSelectionRange(0, 99999);
    try { 
        document.execCommand('copy'); 
        alert("💖 คัดลอกสถิติเฮงๆ สำเร็จแล้วจ้า! 💰🎉"); 
    } catch (err) { 
        navigator.clipboard.writeText(ta.value).then(() => alert("💖 คัดลอกสำเร็จ! 💰")); 
    }
    ta.style.display = "none";
}
