<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ 💖 💰 โปรแกรมสูตรสถิติหวยอัจฉริยะ V7.2 💰 💖 ✨</title>
    <style>
        @keyframes glowBlink {
            0% { filter: drop-shadow(0 0 2px #ff80ab) drop-shadow(0 0 10px #ff4081); transform: scale(1); }
            50% { filter: drop-shadow(0 0 8px #40c4ff) drop-shadow(0 0 20px #00b0ff); transform: scale(1.01); }
            100% { filter: drop-shadow(0 0 2px #ffab40) drop-shadow(0 0 10px #ff9100); transform: scale(1); }
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(135deg, #fff0f5, #e0f7fa, #fff3e0); 
            margin: 0; 
            padding: 10px; 
            color: #4a3b5c; 
            font-size: 14px; 
        }
        .header { 
            background: linear-gradient(135deg, #ff4081, #ff9100, #00b0ff); 
            color: #ffffff; 
            text-align: center; 
            padding: 16px; 
            font-size: 17px; 
            font-weight: bold; 
            border-radius: 12px; 
            box-shadow: 0 6px 15px rgba(255, 64, 129, 0.3); 
            animation: glowBlink 2s infinite alternate;
        }
        .user-info-box {
            background: #ffffff !important;
            border: 2px solid #ff80ab !important;
            border-radius: 10px !important;
            margin-top: 10px;
            margin-bottom: 12px; 
            padding: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 10px;
            box-shadow: 0 3px 10px rgba(255, 128, 171, 0.15);
        }
        .input-container { position: relative; width: 100%; margin-top: 8px; }
        textarea { 
            width: 100%; 
            height: 110px; 
            padding: 10px; 
            padding-bottom: 35px; 
            box-sizing: border-box; 
            font-family: monospace; 
            font-size: 14px; 
            border: 2px solid #ff80ab; 
            border-radius: 10px; 
            resize: vertical; 
            background: #ffffff;
        }
        textarea:focus {
            outline: none;
            border-color: #00b0ff;
            box-shadow: 0 0 0 3px rgba(0, 176, 255, 0.2);
        }
        .btn-clear { 
            position: absolute; 
            bottom: 8px; 
            right: 8px; 
            background: #ffebee; 
            color: #c62828; 
            border: 1px solid #ffcdd2; 
            padding: 5px 12px;

            font-size: 11px;

        }
        .btn-clear:hover { background: #ffcdd2; }
        
        .filter-bar { 
            background: #ffffff; 
            padding: 14px; 
            border-radius: 10px; 
            margin: 10px 0;

        .f-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .f-lbl { font-weight: bold; color: #ff4081; min-width: 75px; font-size: 13px; }
        
        select { 
            padding: 10px; 
            border-radius: 8px; 
            border: 2px solid #ff9100; 
            font-size: 14px; 
            width: 100%; 
            font-weight: bold; 
            color: #d84315; 
            background: #fff3e0; 
        }
        
        .btn { 
            background: #ffffff; 
            border: 1.5px solid #ff80ab; 
            padding: 6px 14px; 
            border-radius: 20px;

            background: #ffffff; 
            padding: 14px; 
            border-radius: 12px; 
            box-shadow: 0 4px 12px rgba(255, 145, 0, 0.15);

            overflow: hidden;

<body>

<div class="header" id="h">✨ 💖 💰 โปรแกรมสูตรสถิติหวยอัจฉริยะ V7.2 💰 💖 ✨</div>
<div class="user-info-box">

</div>
<div class="input-container">
    <textarea id="inp" oninput="saveAndCalc()" placeholder="💖 วางผลสถิติหวยลาว ยี่กี ฯลฯ ได้ทุกรูปแบบ... 💰"></textarea>

</div>

<div class="filter-bar">
    <div class="f-row">
        <span class="f-lbl">🎯 เลือกแนวทาง:</span>
        <select id="sel" onchange="saveAndCalc()"></select> 
    </div>
    
    <div class="f-row">
        <button class="btn-ai" onclick="aiSmartScan()">🤖✨ AI สแกนสูตร 💰🎉</button>
    </div>

    <div class="f-row">
        <span class="f-lbl">📊 จำนวนรอบ:</span>
        <button class="btn active r-btn" onclick="setL(0,this)">ผลทั้งหมด</button>
        <button class="btn r-btn" onclick="setL(3,this)">ผล 3 รอบ</button>
        <button class="btn r-btn" onclick="setL(4,this)">ผล 4 รอบ</button>
        <button class="btn r-btn" onclick="setL(5,this)">ผล 5 รอบ</button>
    </div>
</div>

<div class="grid" id="out"></div>

<script>
let lim = 0;
let rootFactorOffset = 1.23;

function initMenu() {
    const s = document.getElementById('sel');
    s.innerHTML = ""; 
    
    const makeGroup = (lbl, arr) => {
        let g = document.createElement('optgroup'); g.label = lbl;
        arr.forEach(i => {
            let o = document.createElement('option');
            let name = Array.isArray(i) ? i[0] : i;
            let mode = Array.isArray(i) ? i[1] : "top_2d";
            let len = Array.isArray(i) ? i[2] : 4;
            let type = Array.isArray(i) ? (i[3] || "ปกติ") : "ปกติ";
            
            o.value = `${name}|${mode}|${len}|${type}`; 
            o.textContent = name;
            g.appendChild(o);
        });
        s.appendChild(g);
    };

    makeGroup("—— 💖 พิกัด / วิ่ง / รูด VIP 💖 ——", [
        ["พิกัด 1 ตัว","top_2d",1], ["พิกัด 2 ตัว","top_2d",2], ["พิกัดบน 3 ตัว","top_2d",3], ["พิกัดบน 4 ตัว","top_2d",4],
        ["พิกัดล่าง 3 ตัว","bot_2d",3], ["พิกัดล่าง 4 ตัว","bot_2d",4], ["พิกัดวินบน-ล่าง","both_2d",7],
        ["วิ่งบนล่าง 1 ตัว","both_2d",1], ["วิ่งบนล่าง 2 ตัว","both_all",2], ["วิ่งบน 1 ตัว","top_2d",1], ["วิ่งล่าง 1 ตัว","bot_2d",1],
        ["รูดตัวเดียว (บนล่าง)","both_2d",1], ["รูด 2 ตัว (บนล่าง)","both_all",2], ["รูดบน 2 ตัว","top_2d",2], ["รูดล่าง 2 ตัว","bot_2d",2]
    ]);

    makeGroup("—— 🍊 เลขวิน VIP (คู่คี่ / สูงต่ำ) 🍊 ——", [
        ["วินบน 5 ตัว","win_top_2d",5], ["วินบน 6 ตัว","win_top_2d",6], ["วินบน 7 ตัว","win_top_2d",7], ["วินบน 8 ตัว","win_top_2d",8], ["วินบน 9 ตัว","win_top_2d",9],
        ["วินล่าง 5 ตัว","win_bot_2d",5], ["วินล่าง 6 ตัว","win_bot_2d",6], ["วินล่าง 7 ตัว","win_bot_2d",7], ["วินล่าง 8 ตัว","win_bot_2d",8], ["วินล่าง 9 ตัว","win_bot_2d",9],
        ["วินบนล่าง 5 ตัว","win_both_2d",5], ["วินบนล่าง 6 ตัว","win_both_2d",6], ["วินบนล่าง 7 ตัว","win_both_2d",7], ["วินบนล่าง 8 ตัว","win_both_2d",8], ["วินบนล่าง 9 ตัว","win_both_2d",9]
    ]);

    makeGroup("—— 🎯 คู่ / คี่ / สูง / ต่ำ แยกรายหลัก (ตามต้องการ) 🎯 ——", [
        ["คู่ ร้อย", "roi", 5, "odd_even"], ["คู่ สิบบน", "sib_top", 5, "odd_even"], ["คู่ หน่วยบน", "noi_top", 5, "odd_even"], ["คู่ สิบล่าง", "sib_bot", 5, "odd_even"], ["คู่ หน่วยล่าง", "noi_bot", 5, "odd_even"],
        ["คี่ร้อย", "roi", 5, "odd_even"], ["คี่ สิบบน", "sib_top", 5, "odd_even"], ["คี่หน่วยบน", "noi_top", 5, "odd_even"], ["คี่สิบล่าง", "sib_bot", 5, "odd_even"], ["คี่หน่วยล่าง", "noi_bot", 5, "odd_even"],
        ["สูงร้อย", "roi", 5, "high_low"], ["สูงสิบบน", "sib_top", 5, "high_low"], ["สูงหน่วยบน", "noi_top", 5, "high_low"], ["สูงสิบล่าง", "sib_bot", 5, "high_low"], ["สูงหน่วยล่าง", "noi_bot", 5, "high_low"],
        ["ต่ำร้อย", "roi", 5, "high_low"], ["ต่ำ สิบบน", "sib_top", 5, "high_low"], ["ต่ำหน่วยบน", "noi_top", 5, "high_low"], ["ต่ำสิบล่าง", "sib_bot", 5, "high_low"], ["ต่ำหน่วยล่าง", "noi_bot", 5, "high_low"]
    ]);

    let p = [];
    for(let n=5; n<=9; n++) p.push([`ปักสิบบน ${n} ตัว`,"p_sib_top",n]);
    for(let n=5; n<=9; n++) p.push([`ปักหน่วยบน ${n} ตัว`,"p_noi_top",n]);
    for(let n=5; n<=9; n++) p.push([`ปักสิบล่าง ${n} ตัว`,"p_sib_bot",n]); 
    for(let n=5; n<=9; n++) p.push([`ปักหน่วยล่าง ${n} ตัว`,"p_noi_bot",n]); 
    for(let n=5; n<=9; n++) p.push([`ปักหลักร้อย ${n} ตัว`,"p_roi",n]);
    makeGroup("—— 💙 ปักหลัก VIP 💙 ——", p);

    let fx = [["คงที่วิ่งบนล่าง 2 ตัว","both_2d",2],["คงที่วิ่งบน 2 ตัว","top_2d",2],["คงที่วิ่งล่าง 2 ตัว","bot_2d",2],["คงที่ 2 ตัว","both_2d",2],["คงที่บน 2 ตัว","top_2d",2],["คงที่บน 3 ตัว","top_2d",3],["คงที่บน 4 ตัว","top_2d",4],["คงที่ล่าง 2 ตัว","bot_2d",2],["คงที่ล่าง 3 ตัว","bot_2d",3],["คงที่ล่าง 4 ตัว","bot_2d",4]];
    for(let n=5; n<=9; n++) { fx.push([`คงที่วินบน ${n} ตัว`,"win_top_2d",n]); fx.push([`คงที่วินล่าง ${n} ตัว`,"win_bot_2d",n]); }
    
    makeGroup("—— ✨ เลขคงที่ VIP ✨ ——", fx);
    makeGroup("—— 💰 แนวทางจับทางเลข VIP 💰 ——",[["จับหลักร้อย (หาเลขเดินดี)","p_roi",1,"จับทาง"],["จับหลักสิบบบน (หาเลขเดินดี)","p_sib_top",1,"จับทาง"],["จับหลักหน่วยบน (หาเลขเดินดี)","p_noi_top",1,"จับทาง"]]);
}

function setL(l, b) { lim = l; document.querySelectorAll('.r-btn').forEach(i => i.classList.remove('active')); b.classList.add('active'); saveAndCalc(); }

function aiSmartScan() {
    let txt = document.getElementById('inp').value.trim();
    if (!txt) {
        alert("💖 กรุณาวางผลสถิติก่อนใช้งาน AI สแกนสูตรจ้า! 💰");
        return;
    }
    rootFactorOffset = parseFloat((Math.random() * 999.89 + 0.1).toFixed(2));
    calc();
    alert(`✨🎉 AI สแกนสำเร็จปังปุริเย่! 💰 (สูตรที่: ${rootFactorOffset}) เฮงๆ รวยๆ รับทรัพย์จ้า! 🌸`);
}

function saveAndCalc() {
    localStorage.setItem('saved_lottery_data', document.getElementById('inp').value);
    localStorage.setItem('saved_lottery_formula', document.getElementById('sel').value);
    if(document.getElementById('lotteryName')) {
        localStorage.setItem('saved_lottery_title_name', document.getElementById('lotteryName').value);
    }
    calc();
}

function clearData() {
    if(confirm("💖 คุณต้องการล้างข้อมูลสถิติที่พิมพ์ไว้ทั้งหมดใช่หรือไม่? 🧹")) {
        document.getElementById('inp').value = "";
        localStorage.removeItem('saved_lottery_data');
        calc();
    }
}

function generateFrequencySortedDigits(baseVal, rootDegree, length) {
    let val = Math.abs(parseFloat(baseVal));
    if(val === 0) val = 123.45;

    let degree = parseFloat(rootDegree);
    if(degree <= 0) degree = 1.23;
    let rootResult = Math.pow(val, 1 / degree);

    let strNum = rootResult.toFixed(12).replace('.', '');

    let freqMap = {};
    for(let i = 0; i <= 9; i++) freqMap[String(i)] = 0;

    for(let char of strNum) {
        if(freqMap[char] !== undefined) {
            freqMap[char]++;
        }
    }

    let sortedDigits = Object.keys(freqMap).sort((a, b) => {
        if(freqMap[b] !== freqMap[a]) {
            return freqMap[b] - freqMap[a];
        }
        return 0; 
    });

    let finalDigits = [];
    for(let d of sortedDigits) {
        if(!finalDigits.includes(d)) {
            finalDigits.push(d);
        }
    }

    for(let i = 0; i <= 9; i++) {
        let sNum = String(i);
        if(!finalDigits.includes(sNum)) {
            finalDigits.push(sNum);
        }
    }

    return finalDigits.slice(0, length);
}

function calc() {
    let txt = document.getElementById('inp').value.trim(); 
    if (!txt) { document.getElementById('out').innerHTML = ''; return; }
    
    let [tName, mode, lenStr, type] = document.getElementById('sel').value.split('|');
    document.getElementById('h').textContent = `✨ 💖 💰 สถิติแนวทาง ${tName} (แสดงครบทุกหลักในหน้าเดียว) 💰 💖 ✨`;
    
    let userLottery = document.getElementById('lotteryName') ? document.getElementById('lotteryName').value.trim() : '';
    let permanentLine = "momongmo";

    let customHeader = "";
    if (userLottery) customHeader += `🌸 📌 หวย: ${userLottery}\n`;
    customHeader += `💰 💬 ติดต่อ LINE: ${permanentLine} 💸\n`;
    customHeader += `-------------------\n`;

    let lines = txt.split('\n'), parsed = [], rCount = 1, title = "สถิติหวย";
    for (let i = 0; i < Math.min(3, lines.length); i++) {
        if (lines[i].trim() && !lines[i].includes('-') && !lines[i].includes('➡️') && !lines[i].includes('=')) { title = lines[i].trim(); break; }
    }
    
    lines.forEach(l => {
        if (!l.trim()) return;
        let cleanLine = l.replace(/[|➡️\—\=\-|]/g, ' ');
        let m = cleanLine.match(/(\d{3,4})\s+(\d{2})/);
        
        if (m) {
            let lbl = "งวด " + rCount++;
            let dateMatch = l.match(/(\d{1,2}\s+[ก-์a-zA-Z.]+\s+\d{2,4})/);
            let roundMatch = l.match(/^[^0-9]*(\d+)[:.\s]/);
            
            if (dateMatch) lbl = dateMatch[1];
            else if (roundMatch) lbl = "รอบ " + roundMatch[1];
            
            let topPrize = m[1];
            if (topPrize.length === 4) topPrize = topPrize.slice(-3);
            let bottomPrize = m[2];
            
            parsed.push({ r: lbl, top: topPrize, bot: bottomPrize });
        }
    });

    let dLines = lim > 0 ? parsed.slice(-lim) : parsed;
    let g = document.getElementById('out'); 
    g.innerHTML = '';

    // ถ้ารู้สึกว่าเป็นโหมด คู่/คี่ หรือ สูง/ต่ำ ให้แสดงครบทั้ง 5 หลัก (ร้อย, สิบบน, หน่วยบน, สิบล่าง, หน่วยล่าง) ในหน้าเดียว
    let targets = [];
    if (type === "odd_even" || type === "high_low") {
        let prefix = tName.includes("คู่") ? "คู่" : (tName.includes("คี่") ? "คี่" : (tName.includes("สูง") ? "สูง" : "ต่ำ"));
        targets = [
            { name: `${prefix} ร้อย`, mode: "roi", type: type },
            { name: `${prefix} สิบบน`, mode: "sib_top", type: type },
            { name: `${prefix} หน่วยบน`, mode: "noi_top", type: type },
            { name: `${prefix} สิบล่าง`, mode: "sib_bot", type: type },
            { name: `${prefix} หน่วยล่าง`, mode: "noi_bot", type: type }
        ];
    } else {
        // ถ้าเป็นโหมดปกติ แสดงตามเมนูที่เลือกปกติ
        targets = [{ name: tName, mode: mode, type: type }];
    }

    targets.forEach((target, targetIdx) => {
        let win = 0, html = '', raw = '', last = '';
        let groupStr = "";

        dLines.forEach((item, index) => {
            last = item.r; 
            let top3d = item.top; 
            let top2d = item.top.slice(-2); 
            let bot2d = item.bot; 

            let targetVal = "";
            if (target.mode === "roi") targetVal = top3d.charAt(0);
            else if (target.mode === "sib_top") targetVal = top2d.charAt(0);
            else if (target.mode === "noi_top") targetVal = top2d.charAt(1);
            else if (target.mode === "sib_bot") targetVal = bot2d.charAt(0);
            else if (target.mode === "noi_bot") targetVal = bot2d.charAt(1);

            let nVal = parseInt(targetVal) || 0;

            if (target.type === "odd_even") {
                let isEven = (nVal % 2 === 0);
                let isTargetEven = target.name.includes("คู่");
                groupStr = isTargetEven ? "[0,2,4,6,8]" : "[1,3,5,7,9]";
                let isMatch = (isEven === isTargetEven);
                
                if (isMatch) { win++; html += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ✅\n`; raw += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ✅\n`; }
                else { html += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ❌\n`; raw += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ❌\n`; }
            } 
            else if (target.type === "high_low") {
                let isHigh = (nVal >= 5);
                let isTargetHigh = target.name.includes("สูง");
                groupStr = isTargetHigh ? "[5,6,7,8,9]" : "[0,1,2,3,4]";
                let isMatch = (isHigh === isTargetHigh);

                if (isMatch) { win++; html += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ✅\n`; raw += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ✅\n`; }
                else { html += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ❌\n`; raw += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ❌\n`; }
            } 
            else {
                // โหมดคำนวณสูตรปกติ
                let currentFormulaDigits = [];
                let specificDegree = rootFactorOffset + (targetIdx * 3.7);
                let length = parseInt(lenStr) || 4;

                if (index === 0) {
                    let baseVal = parseFloat(item.top + "." + item.bot) * (targetIdx + 1);
                    currentFormulaDigits = generateFrequencySortedDigits(baseVal, specificDegree, length);
                } else {
                    let prevTop = dLines[index - 1].top;
                    let prevBot = dLines[index - 1].bot;
                    let baseVal = parseFloat(prevTop + "." + prevBot) * ((targetIdx + 1) * 7);
                    currentFormulaDigits = generateFrequencySortedDigits(baseVal, specificDegree, length);
                }

                let formulaStr = currentFormulaDigits.join('');
                groupStr = `[${formulaStr}]`;
                let checkDigits = [...new Set(currentFormulaDigits)];
                let isWin = false, matchCount = 0;

                let targetNum = targetVal;
                for(let ch of targetNum) { if(checkDigits.includes(ch)) matchCount++; }
                if(matchCount > 0) isWin = true;

                let sign = isWin ? `✅` : `❌`;
                if (isWin) win++;

                html += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ${sign}\n`;
                raw += `${item.r} = ${groupStr} = ${item.top} - ${item.bot} = ${sign}\n`;
            }
        });

        let rate = dLines.length > 0 ? parseFloat(((win / dLines.length) * 100).toFixed(1)) : 0;
        let cardId = `target_${targetIdx}`;

        let d = document.createElement('div'); 
        d.className = 'card';
        d.innerHTML = `
            <div class="c-head">
                <div>✨ 💰 ${target.name}</div>
                <div>ถูก/ผิด=${win}/${dLines.length-win}=${rate}%</div>
            </div>
            <div class="box">
                <button class="btn-copy" onclick="cp('${cardId}')">คัดลอก</button>
                <div class="list">${html}</div>
                <textarea id="raw-${cardId}" style="display:none">${customHeader}${title}\nแนวทาง: ${target.name}\nถูก/ผิด = ${win}/${dLines.length - win} (${rate}%)\n\n${raw}</textarea>
            </div>
            <div class="next">💰 แนวทาง = ${groupStr} 💸</div>
        `;
        g.appendChild(d);
    });
}

function cp(id) {
    let ta = document.getElementById(`raw-${id}`);
    ta.style.display = "block"; 
    ta.select(); 
    ta.setSelectionRange(0, 99999);
    try { 
        document.execCommand('copy'); 
        alert("💖 คัดลอกสถิติเฮงๆ สำเร็จแล้วจ้า! 💰🎉"); 
    } catch (err) { 
        navigator.clipboard.writeText(ta.value).then(() => alert("💖 คัดลอกสำเร็จ! 💰")); 
    }
    ta.style.display = "none";
}

window.onload = function() {
    initMenu();
    const savedData = localStorage.getItem('saved_lottery_data');
    const savedFormula = localStorage.getItem('saved_lottery_formula');
    const savedTitle = localStorage.getItem('saved_lottery_title_name');
    
    if (savedData) document.getElementById('inp').value = savedData;
    if (savedTitle && document.getElementById('lotteryName')) document.getElementById('lotteryName').value = savedTitle;
    if (savedFormula) document.getElementById('sel').value = savedFormula;
    else document.getElementById('sel').value = "คู่ สิบบน|sib_top|5|odd_even"; 
    
    calc();
};
</script>
