<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 เข้าสู่ระบบ VIP - DOMINO</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #fdf6f9, #f4e2eb);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(214, 51, 132, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border-top: 5px solid #d63384;
        }
        h2 {
            color: #d63384;
            margin-bottom: 8px;
            font-size: 1.4rem;
        }
        p.subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #d63384;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #loading {
            display: none;
            color: #d63384;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>💎 VIP LOGIN</h2>
        <p class="subtitle">กรอกรหัสผ่านเพื่อเข้าใช้งานระบบ</p>
        
        <input type="password" id="vipPassword" placeholder="🔑 ใส่รหัส VIP ที่นี่" autofocus>
        <button onclick="checkLogin()">เข้าสู่ระบบ 🚀</button>
        
        <div id="loading">⏳ กำลังตรวจสอบสิทธิ์กับฐานข้อมูล...</div>
    </div>

    <script>
        function checkLogin() {
            let password = document.getElementById('vipPassword').value.trim();
            if (!password) {
                alert("⚠️ กรุณากรอกรหัสผ่านก่อนครับ");
                return;
            }

            document.getElementById('loading').style.display = "block";

            // 🔗 เชื่อมต่อไปยัง Google Apps Script API ของคุณ
            let scriptURL = "https://script.google.com/macros/s/AKfycbzbVrM8VYPQWbDDyB7LzZuAOPFAhNYbBTeQ2-1SthFdP_VPLECpfpEK3TxX7-DeHSCp/exec";

            fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    password: password,
                    device: navigator.userAgent 
                })
            })
            .then(response => {
                document.getElementById('loading').style.display = "none";
                alert("✨ ตรวจสอบสิทธิ์สำเร็จ! ยินดีต้อนรับสู่ระบบ");
                window.location.href = "hub.html"; // พาไปยังหน้าเมนูรวมโปรแกรม
            })
            .catch(error => {
                document.getElementById('loading').style.display = "none";
                alert("❌ เกิดข้อผิดพลาดในการเชื่อมต่อระบบ");
            });
        }
    </script>
</body>
</html>
