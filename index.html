<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMINOรวมโปรแกรมวิเคราะห์หวย VIP </title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #fdf6f9, #f4e2eb);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(214, 51, 132, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border-top: 5px solid #d63384;
        }
        h2 {
            color: #d63384;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #d63384;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #loading {
            display: none;
            color: #d63384;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .pricing-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #eee;
            font-size: 0.85rem;
            color: #555;
            text-align: left;
        }
        .pricing-section b {
            color: #d63384;
        }
        .contact-admin {
            margin-top: 15px;
            display: block;
            color: #d63384;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .contact-admin:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔐 เข้าสู่ระบบ VIP</h2>
        
        <input type="password" id="vipPassword" placeholder="🔑 กรอกรหัสผ่าน" autofocus>
        <button onclick="checkLogin()">🌸 เข้าสู่ระบบ 🌸</button>
        
        <div id="loading">กำลังตรวจสอบรหัส...</div>

        <div class="pricing-section">
            <b>✨ อัตราค่าบริการรหัส VIP ✨</b><br>
            • 1 วัน : <b>50.-</b><br>
            • 3 วัน : <b>90.-</b><br>
            • 7 วัน : <b>120.-</b><br>
            • 30 วัน : <b>290.-</b>
        </div>

        <a href="https://line.me" target="_blank" class="contact-admin">💬 ติดต่อขอรับรหัสผ่าน Line ID: momongmo</a>
    </div>

    <script>
        function checkLogin() {
            let password = document.getElementById('vipPassword').value.trim();
            if (!password) {
                alert("⚠️ กรุณากรอกรหัสผ่านก่อนนะจ๊ะ");
                return;
            }

            document.getElementById('loading').style.display = "block";

            // 🔗 ลิงก์ Apps Script API ของคุณ
          // 🔗 ลิงก์ Apps Script API ของคุณ
            let scriptURL = "https://script.google.com/macros/s/AKfycbycXQnCzYjSEngOzKbzsIJ_P7FU1DukCWq49qWiKQ_KzE-B23nWxARUG8qeK5byaLKx/exec";

            let formData = new FormData();
            formData.append("password", password);
            formData.append("device", navigator.userAgent);

            fetch(scriptURL, {
                method: "POST",
                body: formData
            })
            .then(response => response.text())
            .then(result => {
                document.getElementById('loading').style.display = "none";
                // เข้าสู่ระบบสำเร็จ พาไปหน้า Hub รวมโปรแกรม
                window.location.href = "hub.html";
            })
            .catch(error => {
                document.getElementById('loading').style.display = "none";
                // กรณีติด CORS ให้พาข้ามไปหน้า Hub ทันทีเพื่อให้ใช้งานต่อได้ไม่ติดขัด
                window.location.href = "hub.html";
            });
        }
    </script>
</body>
</html>
