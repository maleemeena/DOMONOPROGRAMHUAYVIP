<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ DOMINOPROGRAMVIP ✨</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #fff; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 15px; border: 2px solid #d4af37; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 5px 20px rgba(212,175,55,0.2); }
        h2 { color: #d4af37; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; box-sizing: border-box; text-align: center; font-size: 1rem; }
        input:focus { border-color: #d4af37; outline: none; }
        button { width: 100%; padding: 12px; background: #d4af37; color: #111; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 1rem; text-transform: uppercase; }
        button:hover { background: #b89728; }
        #loading { display: none; color: #ff69b4; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>✨ DOMINO VIP ✨</h2>
        <input type="text" id="username" placeholder="ชื่อผู้ใช้ (Username)">
        <input type="password" id="password" placeholder="รหัสผ่าน (Password)">
        <button onclick="submitLogin()">เข้าสู่ระบบ</button>
        <div id="loading">กำลังตรวจสอบข้อมูล...</div>
    </div>

    <script>
        async function submitLogin() {
            let username = document.getElementById('username').value.trim();
            let password = document.getElementById('password').value.trim();

            if (!username || !password) {
                alert("⚠️ กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบถ้วนครับ!");
                return;
            }

            document.getElementById('loading').style.display = "block";

            let scriptURL = "https://script.google.com/macros/s/AKfycbyTV_553bIJo-V8HLTPyiByCMgX-8ygPV5rBgM1FaWK8akcGc8d_CHKJMPzNnkPLyE/exec"; // <-- 📌 นำลิงก์ Apps Script (/exec) มาวางตรงนี้

            let postData = {
                username: username,
                password: password,
                packageDays: "1",
                basePrice: "0",
                exactAmount: "0"
            };

            try {
                let response = await fetch(scriptURL, {
                    method: "POST",
                    body: JSON.stringify(postData)
                });
                let textResult = await response.text();
                document.getElementById('loading').style.display = "none";
                
                let result;
                try {
                    result = JSON.parse(textResult);
                } catch (e) {
                    result = { status: "success", message: textResult };
                }

                if (result.status === "success") {
                    alert("🎉 เข้าสู่ระบบสำเร็จ!");
                    window.location.href = "hub.html"; // หรือหน้าที่ต้องการให้เด้งไป
                } else {
                    alert(result.message || "⚠️ เกิดข้อผิดพลาด");
                }
            } catch (error) {
                document.getElementById('loading').style.display = "none";
                alert("⚠️ เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ");
            }
        }
    </script>
</body>
</html>
