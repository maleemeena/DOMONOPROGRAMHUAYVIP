    <script>
        function loadProgram(pageUrl, btnElement) {
            document.getElementById('mainFrame').src = pageUrl;
            let buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

        // ฟังก์ชันออกจากระบบ

            if(confirm("คุณต้องการออกจากระบบใช่หรือไม่?")) {
                localStorage.removeItem("expireDate");
                window.location.href = "index.html";
            }
        }

        // ดึงวันหมดอายุมาแสดงผล
       window.onload = function() {
    let expireDate = localStorage.getItem("expireDate");
    if(expireDate) {
        // ถ้าเป็นรูปแบบวันที่ยาวๆ ให้แปลงเป็นรูปแบบสั้น (dd/MM/yyyy)
        let d = new Date(expireDate);
        if (!isNaN(d.getTime())) {
            let day = String(d.getDate()).padStart(2, '0');
            let month = String(d.getMonth() + 1).padStart(2, '0');
            let year = d.getFullYear();
            expireDate = `${day}/${month}/${year}`;
        }
        document.getElementById('expireDisplay').innerHTML = "📅 หมดอายุ: " + expireDate;
    } else {
        document.getElementById('expireDisplay').innerHTML = "📅 สถานะ: VIP";
