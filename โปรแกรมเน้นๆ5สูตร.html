<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💎 DNA 5-FORMULA PRO V11 [FULL] 💎</title>
    <style>
        :root { --gold: #d4af37; --dark: #1a252f; --win: #27ae60; --win3: #e67e22; --bg: #f4f7f6; --blue: #3498db; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 8px; color: #333; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: var(--dark); color: #fff; padding: 12px; border-radius: 15px; text-align: center; border-bottom: 3px solid var(--gold); }
        .stat-card b { color: var(--gold); font-size: 18px; }
        .main-card { background: #fff; border-radius: 20px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        input, select, textarea { width: 100%; border: 1px solid #eee; border-radius: 10px; padding: 10px; font-size: 14px; outline: none; box-sizing: border-box; }
        .finance-box, .table-box { background: #fffdf0; border: 1px solid var(--gold); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
        summary { cursor: pointer; padding: 10px; font-weight: bold; text-align: center; color: var(--dark); background: #fdf5d2; list-style: none; border-bottom: 1px solid #eee; }
        .btn-scan { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; padding: 14px; border: none; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 8px; }
        .btn-calc { background: var(--dark); color: var(--gold); padding: 14px; border: 1px solid var(--gold); border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-clear { background: #e74c3c; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 14px; }
        .table-wrap { overflow-x: auto; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #f8f9fa; padding: 10px; font-size: 11px; border-bottom: 2px solid #eee; }
        td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #f1f1f1; font-size: 12px; }
        .win-tag { display: block; font-size: 10px; color: white; border-radius: 4px; padding: 2px; margin-top: 2px; font-weight: bold; }
        .bg-win2 { background: var(--win); } .bg-win3 { background: var(--win3); } .bg-root { background: var(--blue); }
        .report-box { background: white; border-radius: 15px; padding: 15px; margin-top: 10px; border-left: 8px solid #ddd; }
        .report-box.is-best { border-left-color: var(--gold); background: #fffef2; box-shadow: 0 5px 15px rgba(212,175,55,0.1); }
        pre { white-space: pre-wrap; font-family: monospace; font-size: 13px; margin: 10px 0; line-height: 1.5; color: #444; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        .best-formula { background: #fff9e6 !important; font-weight: bold; }
        .manual-box { background: #eef7ff; padding: 12px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #3498db; }
    </style>
</head>
<body>

<h2 style="text-align:center; color:var(--dark); margin: 10px 0;">💎 DNA 5-FORMULA PRO V11 💎</h2>

<div class="stat-grid">
    <div class="stat-card"><small>🏆 สูตรที่แม่นที่สุด</small><br><b id="topName">-</b></div>
    <div class="stat-card"><small>💰 กำไรสะสม</small><br><b id="topProfit">0</b></div>
</div>

<!-- ✅ ส่วนที่กลับมา: ตั้งค่าต้นทุน -->
<details class="finance-box" id="finSettings">
    <summary>⚙️ ตั้งค่าต้นทุนและราคาจ่าย</summary>
    <div style="padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div><small>ทุน/รอบ:</small><input type="number" id="cost" value="30" oninput="saveSet()"></div>
        <div><small>จ่าย 2ตัว:</small><input type="number" id="p2" value="90" oninput="saveSet()"></div>
        <div><small>จ่าย 3ตรง:</small><input type="number" id="p3s" value="900" oninput="saveSet()"></div>
        <div><small>จ่าย 3โต๊ด:</small><input type="number" id="p3t" value="150" oninput="saveSet()"></div>
    </div>
</details>

<div class="main-card">
    <div class="input-row">
        <input type="text" id="lottoName" placeholder="ชื่อหวย" value="หวยยี่กี" oninput="saveSet()">
        <input type="text" id="adminName" placeholder="แอดมิน" value="ADMIN" oninput="saveSet()">
    </div>

    <div class="manual-box">
        <small style="color:#2980b9; font-weight:bold;">🔢 ผลล่าสุด (บน - ล่าง)</small>
        <div class="input-row" style="margin-top:5px;">
            <input type="number" id="manualTop" placeholder="3 ตัวบน" oninput="saveSet()">
            <input type="number" id="manualBottom" placeholder="2 ตัวล่าง" oninput="saveSet()">
        </div>
    </div>

    <textarea id="bulkInput" rows="4" placeholder="วางสถิติย้อนหลัง..."></textarea>
    
    <button class="btn-scan" onclick="autoScanAll()">🚀 AI SCAN วิเคราะห์ 5 สูตร</button>
    
    <div class="input-row">
        <button class="btn-calc" onclick="processChain()">🔥 คำนวณเลขรอบใหม่</button>
        <button class="btn-clear" onclick="clearData()">🧹 ล้างข้อมูล</button>
    </div>
    
    <div class="input-row" style="margin-top:8px;">
        <select id="winType" onchange="saveSet()">
            <option value="วินบน">💎 วินบน (3-2ตัว)</option>
            <option value="รูด2ตัว">💰 รูด 2 ตัว (บน-ล่าง)</option>
        </select>
        <input type="number" id="rootVal" value="2.0" step="0.1" oninput="saveSet()">
    </div>
</div>

<!-- ✅ ส่วนที่กลับมา: ตัวพับตารางสถิติ -->
<details class="table-box" id="tableCollapse" open>
    <summary>📊 ตารางตรวจสอบสถิติ 5 สูตร</summary>
    <div class="table-wrap">
        <table>
            <thead>
                <tr><th>งวด</th><th>ส.1</th><th>ส.2</th><th>ส.3</th><th>ส.4</th><th>ส.5</th><th>ผล</th></tr>
                <tr style="background:#fdf5d2" id="accRow"><td>ACC%</td><td id="acc0">-</td><td id="acc1">-</td><td id="acc2">-</td><td id="acc3">-</td><td id="acc4">-</td><td>-</td></tr>
            </thead>
            <tbody id="bBody"></tbody>
        </table>
    </div>
</details>

<!-- ✅ ส่วนที่กลับมา: พื้นที่แสดงรายงานผล -->
<div id="reportArea"></div>

<script>
    const labels = ["ส.1", "ส.2", "ส.3", "ส.4", "ส.5"];
    let winLogs = [[], [], [], [], []];

    window.onload = function() {
        const ids = ['cost','p2','p3s','p3t','lottoName','adminName','winType','rootVal','manualTop','manualBottom','bulkInput'];
        ids.forEach(id => {
            let val = localStorage.getItem('dna5_v11_fix_'+id);
            if(val) document.getElementById(id).value = val;
        });
    };

    function saveSet() {
        const ids = ['cost','p2','p3s','p3t','lottoName','adminName','winType','rootVal','manualTop','manualBottom','bulkInput'];
        ids.forEach(id => localStorage.setItem('dna5_v11_fix_'+id, document.getElementById(id).value));
    }

    function extractData(t) {
        if (!t || t.trim() === "") return null;
        let allNums = t.match(/\d+/g);
        if (!allNums || allNums.length < 2) return null;
        
        let idx3 = allNums.findIndex(n => n.length === 3);
        let top = (idx3 !== -1) ? allNums[idx3] : allNums[0];
        let bottom = (idx3 !== -1) ? (allNums.find((n, i) => i !== idx3 && n.length >= 2) || "00") : allNums[1];

        // แก้ชื่อรอบให้เต็ม ไม่โดนตัด
        let dateMatch = t.match(/\d{1,2}\s+[^\d]+\s+\d{2}/);
        let label = dateMatch ? dateMatch[0] : t.split(/[|:-]/)[0].trim().substring(0, 15);

        return { 
            top: top.slice(-3).padStart(3, '0'), 
            bottom: bottom.slice(-2).padStart(2, '0'),
            full: `${top.slice(-3)}-${bottom.slice(-2)}`,
            label: label || "งวดเก่า"
        };
    }

    function calculateSets(base, r) {
        let res = [];
        let b = parseFloat(base) || 0;
        let root = parseFloat(r) || 2.0;
        for(let i=0; i<5; i++) {
            let val = Math.pow(b + (i * 145.67) + (i * i * 7.89), 1 / root);
            let dec = val.toFixed(20).split('.')[1];
            let temp = new Set();
            for(let j=0; temp.size < 6 && j < dec.length; j++) temp.add(dec[j]);
            let fb = "0123456789";
            for(let j=0; temp.size < 6; j++) temp.add(fb[j]);
            res.push(Array.from(temp).join(''));
        }
        return res;
    }

    function checkWin(set, actual, mode) {
        let d = extractData(actual); if(!d) return { ok: false, inc: 0, st: 'X', hit: '' };
        let cost = parseFloat(document.getElementById('cost').value) || 0;
        let p2 = parseFloat(document.getElementById('p2').value) || 0;
        let p3s = parseFloat(document.getElementById('p3s').value) || 0;
        let p3t = parseFloat(document.getElementById('p3t').value) || 0;
        let isMatch = (target, s) => target.split('').every(x => s.includes(x));
        
        if (mode === "รูด2ตัว") {
            let r2 = set.slice(0, 2);
            let hitTop = r2.split('').some(x => d.top.includes(x));
            let hitBottom = r2.split('').some(x => d.bottom.includes(x));
            if(hitTop || hitBottom) return { ok: true, st: `[${r2}] เข้า`, inc: p2 - cost, cls: 'bg-root', hit: r2 };
        } else {
            let t3 = d.top, t2 = d.top.slice(-2), b2 = d.bottom;
            if(t3 === set.slice(0,3)) return { ok: true, st: `[${t3}] 3ตรง`, inc: p3s - cost, cls: 'bg-win3', hit: t3 };
            if(isMatch(t3, set)) return { ok: true, st: `[${t3}] 3โต๊ด`, inc: p3t - cost, cls: 'bg-win3', hit: t3 };
            if(isMatch(t2, set)) return { ok: true, st: `[${t2}] 2บน`, inc: p2 - cost, cls: 'bg-win2', hit: t2 };
            if(isMatch(b2, set)) return { ok: true, st: `[${b2}] 2ล่าง`, inc: p2 - cost, cls: 'bg-win2', hit: b2 };
        }
        return { ok: false, inc: -cost, st: '❌', hit: '' };
    }

    function getFocusPairs(set, n) {
        let r2 = set.slice(0, 2).split('');
        let others = set.slice(2).split('');
        let pairs = [];
        if(n === 2) {
            r2.forEach(d => others.forEach(o => pairs.push(d + o)));
            pairs.push(r2[0] + r2[1]);
        } else {
            r2.forEach(d => {
                for(let i=0; i<others.length; i++) {
                    for(let j=i+1; j<others.length; j++) pairs.push(d + others[i] + others[j]);
                }
            });
        }
        return pairs;
    }

    function processChain() {
        saveSet();
        let r = document.getElementById('rootVal').value, m = document.getElementById('winType').value;
        let mTop = document.getElementById('manualTop').value, mBottom = document.getElementById('manualBottom').value;
        let inputStr = document.getElementById('bulkInput').value.trim();
        let lines = inputStr.split('\n').filter(l => extractData(l) !== null);
        
        let profits = [0,0,0,0,0], winCounts = [0,0,0,0,0];
        winLogs = [[], [], [], [], []];
        let history = [];

        if(lines.length >= 2) {
            lines.forEach((line, i) => {
                if(i === 0) return;
                let prev = extractData(lines[i-1]);
                let sets = calculateSets(prev.top + "." + prev.bottom, r);
                let d = extractData(line);
                sets.forEach((s, idx) => {
                    let res = checkWin(s, line, m);
                    profits[idx] += res.inc;
                    if(res.ok) winCounts[idx]++;
                    let displaySet = (m === "รูด2ตัว") ? s.slice(0, 2) : s;
                    winLogs[idx].push(`${d.label}: [${displaySet}] ออก ${d.full} -> ${res.ok ? '✅ '+res.st : '❌'}`);
                });
                history.push({ sets, actual: line, label: d.label });
            });
        }

        let bestIdx = profits.indexOf(Math.max(...profits));
        document.getElementById('topName').innerText = labels[bestIdx];
        document.getElementById('topProfit').innerText = profits[bestIdx].toLocaleString();

        labels.forEach((_, i) => {
            let rate = lines.length > 1 ? Math.round((winCounts[i] / (lines.length - 1)) * 100) : 0;
            document.getElementById('acc' + i).innerHTML = `<b>${rate}%</b>`;
        });

        let baseNum = (mTop && mBottom) ? (mTop + "." + mBottom) : (lines.length > 0 ? extractData(lines[lines.length-1]).top + "." + extractData(lines[lines.length-1]).bottom : "0.0");
        let nextSets = calculateSets(baseNum, r);
        let tableHTML = `<tr style="background:#eef7ff; font-weight:bold;"><td>NEXT</td>${nextSets.map((s,i)=>`<td class="${i==bestIdx?'best-formula':''}">${(m==="รูด2ตัว")?s.slice(0,2):s}</td>`).join('')}<td>รอผล</td></tr>`;
        
        history.reverse().forEach((h) => {
            let d = extractData(h.actual);
            tableHTML += `<tr><td>${d.label}</td>`;
            h.sets.forEach((s, i) => {
                let res = checkWin(s, h.actual, m);
                let disp = (m === "รูด2ตัว") ? s.slice(0, 2) : s;
                tableHTML += `<td class="${i==bestIdx?'best-formula':''}"><div>${disp}</div>${res.ok?`<span class="win-tag ${res.cls}">${res.st}</span>`:'<div style="color:#ccc; font-size:10px">❌</div>'}</td>`;
            });
            tableHTML += `<td style="background:#fafafa"><b>${d.top}</b><br><small>${d.bottom}</small></td></tr>`;
        });
        document.getElementById('bBody').innerHTML = tableHTML;
        renderFinalReports(nextSets, winCounts, lines.length-1, profits);
    }

    function renderFinalReports(nextSets, winCounts, total, profits) {
        let area = document.getElementById('reportArea'); area.innerHTML = "";
        let m = document.getElementById('winType').value;
        let data = labels.map((l, i) => ({
            name: l, set: nextSets[i], log: winLogs[i].slice().reverse().join('\n'),
            acc: total > 0 ? Math.round((winCounts[i]/total)*100) : 0, profit: profits[i], idx: i
        })).sort((a,b) => b.profit - a.profit);

        let overallFocus = nextSets.map(s => s.slice(0, 2)).join(', ');

        data.forEach((d, rank) => {
            let lotto = document.getElementById('lottoName').value;
            let admin = document.getElementById('adminName').value;
            let d2 = getFocusPairs(d.set, 2);
            let d3 = getFocusPairs(d.set, 3);
            
            let header = (m === "รูด2ตัว") ? `🔥 ชุดรูดเน้นๆ: ${overallFocus}\n🔥 รูดสายนี้: ${d.set.slice(0,2).split('').join(',')}` : `💎 วิน 6 ตัว: ${d.set}\n🔥 ชุดเลขเน้นๆ: ${overallFocus}`;

            const finalTxt = `🎯 แนวทาง ${lotto} 🎯\n🏆 สูตร ${d.name} [เข้า ${d.acc}%]\n━━━━━━━━━━━━\n${header}\n\n📍 เจาะ 2 ตัว:\n${d2.join(' ')}\n\n📍 เจาะ 3 ตัว:\n${d3.slice(0,12).join(' ')}\n━━━━━━━━━━━━\n📊 สถิติย้อนหลัง:\n${d.log}\n━━━━━━━━━━━━\n💰 กำไร: ${d.profit.toLocaleString()} บ.\nBy ${admin}`;

            area.innerHTML += `
                <div class="report-box ${rank==0?'is-best':''}">
                    <strong>${rank== rank==0?'⭐ แนะนำ: ':''} สูตร ${d.name}</strong>
                    <pre id="cp${d.idx}">${finalTxt}</pre>
                    <button class="btn-calc" style="width:100%" onclick="copyText('cp${d.idx}')">📋 คัดลอกรายงาน</button>
                </div>`;
        });
    }

    function autoScanAll() {
        let input = document.getElementById('bulkInput').value.trim().split('\n').filter(l => extractData(l) !== null);
        if(input.length < 3) return alert("ขอสถิติ 3 งวดขึ้นไป");
        let bestR = 2.0, maxP = -999999, mode = document.getElementById('winType').value;
        for(let r=1.0; r<=6.0; r=+(r+0.2).toFixed(1)) {
            let tp = 0;
            for(let i=1; i<input.length; i++) {
                let p = extractData(input[i-1]);
                let sets = calculateSets(p.top+'.'+p.bottom, r);
                sets.forEach(s => tp += checkWin(s, input[i], mode).inc);
            }
            if(tp > maxP) { maxP = tp; bestR = r; }
        }
        document.getElementById('rootVal').value = bestR;
        processChain();
    }

    function copyText(id) {
        const text = document.getElementById(id).innerText;
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        alert("คัดลอกแล้ว!");
    }

    function clearData() {
        if(confirm("ล้างข้อมูล?")) {
            localStorage.clear();
            location.reload();
        }
    }
</script>
</body>
</html>
