<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMINO RICH LIST LOVE - ฐานเลขเศรษฐี</title>
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        :root { --pink: #ff4d6d; --gold: #ffb703; --dark: #590d22; }
        * { box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        body { background: #000; margin: 0; overflow-x: hidden; user-select: none; }
        .neon-bg { position: fixed; inset: 0; background: radial-gradient(circle, #800f2f 0%, #000 100%); z-index: -1; }
        .app-card { background: rgba(255, 255, 255, 0.98); border: 6px double var(--pink); border-radius: 35px; 
                    max-width: 480px; margin: 15px auto; padding: 25px; text-align: center;
                    box-shadow: 0 0 35px var(--pink); position: relative; z-index: 10; }
        h1 { color: var(--pink); text-shadow: 0 0 12px var(--pink); margin: 0; font-size: 26px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid var(--pink); border-radius: 15px; font-size: 16px; text-align: center; font-weight: bold; background: #fff0f3; outline: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button { padding: 14px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; color: #fff; transition: 0.2s; font-size: 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        button:active { transform: scale(0.95); }
        .btn-main { background: linear-gradient(to bottom, #ff758c, #ff0054); grid-column: span 2; font-size: 18px; border-bottom: 4px solid #a4133c; }
        .btn-copy { background: #8338ec; } .btn-print { background: #3a86ff; }
        .btn-img { background: #fb5607; grid-column: span 2; }
        .btn-clear { background: #6c757d; }
        #result { margin-top: 20px; border-top: 3px dashed var(--pink); padding-top: 15px; display: none; }
        .num-circle { width: 48px; height: 48px; background: var(--gold); border-radius: 50%; display: inline-flex; 
                    align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin: 4px; color: #fff; border: 2px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .tag { display: inline-block; background: var(--pink); color: #fff; padding: 5px 12px; border-radius: 10px; margin: 3px; font-weight: bold; font-size: 15px; border: 1px solid #fff; }
        .h-pop { position: fixed; pointer-events: none; z-index: 9999; animation: pop 1.2s ease-out forwards; font-size: 28px; }
        @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0.5); opacity: 1; } 100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)) scale(1.8); opacity: 0; } }
        @media print { .grid, input, select, .neon-bg { display: none !important; } .app-card { border: none; box-shadow: none; } }
    </style>
</head>
<body oncontextmenu="return false;">
<div class="neon-bg"></div>
<div class="app-card" id="captureTarget">
    <h1>🏹 เจ้าแม่วาเลนไทน์ 🏹</h1>
    <div style="font-size:11px; color:var(--dark); font-weight:bold; margin-bottom:10px;">DOMINO RICH LIST LOVE</div>
    <input type="text" id="nameIn" placeholder="ชื่อหวยที่รัก">
    <input type="number" id="numIn" placeholder="กรอกเลขรักตั้งต้น 5 หลัก">
    <select id="baseIn">
        <option value="2">ฐานรักที่ 2 (ฐานคู่รักมหาเสน่ห์)</option>
        <option value="4">ฐานรักที่ 4 (มนตรากวักทรัพย์)</option>
        <option value="8">ฐานรักที่ 8 (แปดทิศรักปิดประตูจน)</option>
        <option value="12">ฐานรักที่ 12 (ฐานรักพารวย)</option>
        <option value="16">ฐานรักที่ 16 (ดาวเศรษฐี)</option>
        <option value="18">ฐานรักที่ 18 (จักรวาลระเบิดทรัพย์)</option>
    </select>
    <div class="grid">
        <button class="btn-main" onclick="magic(event)">🔮 วิเคราะห์เลขรัก</button>
        <button class="btn-copy" onclick="copyText(event)">📋 คัดลอกชุดเลขรัก</button>
        <button class="btn-print" onclick="window.print()">🖨️ พิมพ์ใบผลลัพธ์เลขรัก</button>
        <button class="btn-img" id="btnS" onclick="saveImg(event)">📸 บันทึกเลขรักเป็นรูปภาพ</button>
        <button class="btn-clear" onclick="location.reload()">🧹 ล้างข้อมูลอดีตเลขรัก</button>
    </div>
    <div id="result">
        <h2 id="outName" style="color:var(--pink); margin: 5px 0;"></h2>
        <div id="outSub" style="font-size:13px; margin-bottom:10px; font-weight:bold; color:var(--dark);"></div>
        <div style="color:var(--gold); font-weight:bold;">👑 4 เลขรักเน้นรูด 👑</div>
        <div id="top4"></div>
        <div style="margin-top:15px; font-weight:bold; color:var(--dark);">💎 ชุด 3 ตัว  💎</div>
        <div id="res3"></div>
        <div style="margin-top:15px; font-weight:bold; color:var(--dark);">💕 ชุด 2 ตัว  💕</div>
        <div id="res2"></div>
        <div id="resTime" style="font-size:10px; color:#999; margin-top:15px;"></div>
        <div style="font-size:12px; color:var(--pink); font-weight:bold; margin-top:10px;">✨ โดย DOMINO RICH LIST LOVE ✨</div>
    </div>
</div>

<script>
    function hearts(e) {
        const icons = ['❤️','💖','💝','💗','💕','🌹','🎀'];
        const x = e.clientX || window.innerWidth / 2;
        const y = e.clientY || window.innerHeight / 2;
        for (let i = 0; i < 80; i++) {
            const h = document.createElement('div');
            h.className = 'h-pop';
            h.innerHTML = icons[Math.floor(Math.random()*icons.length)];
            h.style.left = x + 'px'; h.style.top = y + 'px';
            h.style.setProperty('--x', `${(Math.random()-0.5)*800}px`);
            h.style.setProperty('--y', `${(Math.random()-0.5)*800}px`);
            h.style.setProperty('--r', `${Math.random()*720}deg`);
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 1200);
        }
    }

    function magic(e) {
        const raw = document.getElementById('numIn').value;
        const base = parseInt(document.getElementById('baseIn').value);
        if(raw.length !== 5) { alert('ใส่เลขรักให้ครบ 5 หลักเพื่อคำนวณจ้า!'); return; }
        hearts(e);

        // เลขตั้งต้น (แสดงผลแบบไม่มีจุด)
        let v1_str = raw.substring(0,3) + raw.substring(3,5);
        let v2_str = raw.substring(3,5) + raw.substring(0,1) + raw.substring(1,3);

        // คำนวณ (ใช้จุดทศนิยมใน Logic เพื่อหาค่า Mod)
        let v1_calc = parseFloat(raw.substring(0,3) + "." + raw.substring(3,5));
        let v2_calc = parseFloat(raw.substring(3,5) + raw.substring(0,1) + "." + raw.substring(1,3));
        let mod = base / 10;
        let pool = ((v1_calc*mod).toFixed(2) + (v2_calc*mod).toFixed(2)).replace(/\./g,"").split("");

        let counts = {}; pool.forEach(d => counts[d] = (counts[d] || 0) + 1);
        let sorted = Object.entries(counts).sort((a,b)=>b-a).slice(0,4).map(x => x[0]);

        let s2Raw = new Set(), s3Raw = new Set();
        let s2Filtered = new Set(), s3Filtered = new Set();

        for(let i=0; i<pool.length-2; i++){
            s2Raw.add(pool[i]+pool[i+1]);
            s2Raw.add(pool[i]+pool[i+2]);
            s3Raw.add(pool[i]+pool[i+1]+pool[i+2]);
        }
        sorted.forEach(a => sorted.forEach(b => { if(a!==b) s2Raw.add(a+b); }));

        const filterSets = (rawSet, filteredSet) => {
            rawSet.forEach(val => {
                let sortedVal = val.split('').sort().join('');
                if (![...filteredSet].some(item => item.split('').sort().join('') === sortedVal)) {
                    filteredSet.add(val);
                }
            });
        };

        filterSets(s2Raw, s2Filtered);
        filterSets(s3Raw, s3Filtered);

        document.getElementById('outName').innerText = "ชื่อหวยรัก " + (document.getElementById('nameIn').value || "มหาเศรษฐี");
        document.getElementById('outSub').innerText = `ฐานมงคล: ${v1_str} | ${v2_str} [Base ${base}]`;
        document.getElementById('top4').innerHTML = sorted.map(x => `<div class="num-circle">${x}</div>`).join("");
        document.getElementById('res3').innerHTML = Array.from(s3Filtered).slice(0,12).map(x => `<span class="tag">${x}</span>`).join("");
        document.getElementById('res2').innerHTML = Array.from(s2Filtered).slice(0,18).map(x => `<span class="tag">${x}</span>`).join("");
        document.getElementById('resTime').innerText = "คำนวณเลขรักเมื่อ: " + new Date().toLocaleString('th-TH');
        document.getElementById('result').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function copyText(e) {
        hearts(e);
        const name = document.getElementById('outName').innerText;
        const top = Array.from(document.querySelectorAll('#top4 .num-circle')).map(e => e.innerText).join(", ");
        const s3 = Array.from(document.querySelectorAll('#res3 .tag')).map(e => e.innerText).join(", ");
        const s2 = Array.from(document.querySelectorAll('#res2 .tag')).map(e => e.innerText).join(", ");
        const time = document.getElementById('resTime').innerText;
        
        const text = `💖 ผลเลขรักเจ้าแม่วาเลนไทน์ 💖\n👤 ${name}\n--------------------------\n🔥 เลขรัก: ${top}\n💎 ชุด 3 ตัว : ${s3}\n💕 ชุด 2 ตัว : ${s2}\n--------------------------\n✨ ${time}\n🔮 โดย DOMINO RICH LIST LOVE`;
        
        const el = document.createElement('textarea');
        el.value = text; document.body.appendChild(el); el.select();
        document.execCommand('copy'); document.body.removeChild(el);
        alert('✅ คัดลอกเลขรักเรียบร้อยแล้วค่ะ!');
    }

    async function saveImg(e) {
        hearts(e);
        const btn = document.getElementById('btnS'); btn.innerText = "⏳ กำลังบันทึกเลขรัก...";
        try {
            const canvas = await html2canvas(document.querySelector("#captureTarget"), { scale: 2, backgroundColor: "#fff", logging: false, useCORS: true });
            const link = document.createElement('a');
            link.download = `RichLove-${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        } catch(err) {
            alert('กรุณาใช้ Google Chrome เพื่อบันทึกรูปเลขรักนะคะ');
        } finally {
            btn.innerText = "📸 บันทึกเลขรักเป็นรูปภาพ";
        }
    }
</script>
</body>
</html>
