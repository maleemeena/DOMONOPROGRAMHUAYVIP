<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOMINO MASTER 2026 ULTIMATE FIXED</title>
    <style>
        :root { 
            --primary: #0f172a; --accent: #be123c; --gold: #ca8a04; --bg: #f1f5f9; 
            --win: #059669; --drill: #2563eb; --cute: #f472b6;
            --color-basic: #1e293b; --color-plus: #e11d48; --color-back: #d97706;
            --color-j3: #0ea5e9; 
        }
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background: var(--bg); margin: 0; padding: 5px; color: var(--primary); }
        .container { max-width: 500px; margin: auto; background: white; border-radius: 20px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 12px; }
        .stat-card { border-radius: 10px; padding: 6px 1px; text-align: center; color: white; }
        .sc-b { background: var(--color-basic); } .sc-p { background: var(--color-plus); } .sc-k { background: var(--color-back); } .sc-d { background: var(--drill); } .sc-g { background: var(--color-j3); }
        .sc-title { font-size: 0.45rem; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 4px; }
        .sc-val { font-size: 0.65rem; font-weight: 900; }
        .bulk-box { width: 100%; height: 60px; padding: 8px; border-radius: 10px; border: 2px solid #e2e8f0; font-weight: 700; font-size: 0.8rem; margin-bottom: 5px; resize: none; }
        .main-btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 0.85rem; font-weight: 800; cursor: pointer; margin-bottom: 8px; }
        .btn-anal { background: var(--primary); color: #fbbf24; }
        .btn-update { background: var(--win); color: white; }
        .btn-cute { background: var(--cute); color: white; width: 100%; }
        .btn-all { background: #6366f1; color: white; width: 100%; margin-bottom: 10px; }
        .table-wrapper { width: 100%; overflow: hidden; border-radius: 12px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        th { background: #f8fafc; padding: 8px 2px; font-size: 0.45rem; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 8px 2px; border-bottom: 1px solid #f1f5f9; text-align: center; font-size: 0.5rem; vertical-align: top; }
        .prime-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; font-size: 0.75rem; margin: 3px auto; border: 2px solid transparent; }
        .hit-border { border-color: #fbbf24 !important; box-shadow: 0 0 5px #fbbf24; }
        .badge { padding: 2px 4px; border-radius: 4px; font-size: 0.45rem; font-weight: 800; color: white; display: inline-block; margin: 1px; }
        .bg-b { background: var(--color-basic); } .bg-p { background: var(--color-plus); } .bg-k { background: var(--color-back); } .bg-d { background: var(--drill); } .bg-g { background: var(--color-j3); }
        .warn-pill { background: #fee2e2; color: #ef4444; padding: 2px 4px; border-radius: 4px; font-size: 0.45rem; font-weight: 900; display: inline-block; border: 1px solid #fecaca; margin-top: 3px; }
        .drill-box { text-align: left; background: #f8fafc; border-radius: 6px; padding: 4px; border: 1px solid #edf2f7; }
        .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-bottom: 4px; }
        .num-chip { background: white; border: 1px solid #cbd5e1; padding: 1px; border-radius: 3px; font-size: 0.42rem; font-weight: 700; text-align: center; }
        .copy-pill { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 3px; font-size: 0.4rem; cursor: pointer; margin-top: 4px; width: 100%; font-weight: 800; color: var(--drill); }
        .row-hit { background-color: #ecfdf5 !important; }
        #reportModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; }
        .modal-content { background:white; width:92%; max-width:380px; border-radius:30px; padding:20px; text-align:center; border: 4px solid var(--cute); max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="text-align:center; font-size:1rem; margin:5px;">📊 DOMINO MASTER 2026</h2>
    <div class="stat-grid">
        <div class="stat-card sc-b"><div class="sc-title">BASIC</div><div class="sc-val" id="st-b">0</div></div>
        <div class="stat-card sc-p"><div class="sc-title">PLUS</div><div class="sc-val" id="st-p">0</div></div>
        <div class="stat-card sc-k"><div class="sc-title">BACK</div><div class="sc-val" id="st-k">0</div></div>
        <div class="stat-card sc-d"><div class="sc-title">เจาะ 2</div><div class="sc-val" id="st-j2">0</div></div>
        <div class="stat-card sc-g"><div class="sc-title">เจาะ 3</div><div class="sc-val" id="st-j3">0</div></div>
    </div>
    <textarea id="bulkInput" class="bulk-box" placeholder="วิเคราะห์: ลาว 12345"></textarea>
    <button class="main-btn btn-anal" onclick="processBulk()">วิเคราะห์ข้อมูล</button>
    <textarea id="bulkResult" class="bulk-box" style="border-color: var(--win)" placeholder="บันทึกผล: ลาว 67890"></textarea>
    <button class="main-btn btn-update" onclick="processBulkResult()">อัปเดตผล</button>
    <button class="main-btn btn-all" onclick="copyAllToLine()">📋 คัดลอกทั้งหมดลง LINE</button>
    <button class="main-btn btn-cute" onclick="showCuteReport()">✨ สรุปรายงานการ์ดน่ารัก</button>
    
    <div class="table-wrapper">
        <table>
            <thead><tr><th style="width:20%">หวย</th><th style="width:12%">เด่น (B-P-K)</th><th style="width:45%">ชุดเจาะเน้น</th><th style="width:12%">ผล</th><th style="width:11%">สถานะ</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <button class="main-btn" style="background:#ef4444; color:white; margin-top:15px; opacity:0.6; width:100%;" onclick="clearAllData()">🗑️ ล้างข้อมูลทั้งหมด</button>
</div>

<div id="reportModal" onclick="closeReport()"><div class="modal-content" onclick="event.stopPropagation()"><div id="reportContent"></div><button class="main-btn btn-cute" style="margin-top:10px;" onclick="copyFullReport()">📋 ก๊อปปี้สรุปรายงาน</button></div></div>

<script>
let database = JSON.parse(localStorage.getItem('domino_v2026_final_fix_v5')) || [];
const sortS = (s) => s ? s.toString().split('').sort().join('') : "";

function calculateSet(nStr) {
    let nBig = BigInt(nStr);
    const getTopFreq = (str) => {
        let counts = Array(10).fill(0);
        str.split('').forEach(c => { if(!isNaN(parseInt(c))) counts[parseInt(c)]++; });
        return [...Array(10).keys()].sort((a,b) => (counts[b] - counts[a]) || (b - a));
    };
    const sB = (nBig * nBig - 49n).toString();
    const sP = ((nBig + 26n) * 7n).toString();
    const sK = (nBig * 2026n + 15n).toString();
    
    const pB = getTopFreq(sB)[0], pP = getTopFreq(sP)[0], pK = getTopFreq(sK)[0];
    
    // Logic เตือน เบิ้ล ตอง หาม
    const arr = [pB, pP, pK];
    const unique = new Set(arr).size;
    let status = "";
    if (unique === 1) status = "⚠️ ตอง";
    else if (unique === 2) status = "⚠️ เบิ้ล";
    else if (sB.slice(-1) === sK.slice(-1) || sB.slice(-1) === sP.slice(-1)) status = "⚠️ หาม";

    const pool6 = getTopFreq(sB + sP + sK).slice(0, 6);
    const combo = (nums, size) => {
        let res = [];
        const f = (start, cur) => {
            if (cur.length === size) { res.push(sortS(cur.join(''))); return; }
            for (let i = start; i < nums.length; i++) f(i + 1, [...cur, nums[i]]);
        }
        f(0, []); return res;
    };
    return { primes: {B: pB, P: pP, K: pK}, status, pool6, j2: combo(pool6, 2), j3: combo(pool6, 3) };
}

function checkHits(row) {
    if(!row.winValue || row.winValue.length < 2) return {badges: "-", textList: [], hitItems: []};
    const res = row.winValue;
    const s3u = sortS(res.substring(0,3)), s2u = sortS(res.substring(1,3)), s2l = sortS(res.substring(3,5));
    let badges = [], txt = [], hitItems = [];
    
    if(res.includes(row.primes.B.toString())) { badges.push('<span class="badge bg-b">B</span>'); txt.push(`B(${row.primes.B})`); hitItems.push('B'); }
    if(res.includes(row.primes.P.toString())) { badges.push('<span class="badge bg-p">P</span>'); txt.push(`P(${row.primes.P})`); hitItems.push('P'); }
    if(res.includes(row.primes.K.toString())) { badges.push('<span class="badge bg-k">K</span>'); txt.push(`K(${row.primes.K})`); hitItems.push('K'); }
    if(row.j2.includes(s2u) || row.j2.includes(s2l)) { badges.push('<span class="badge bg-d">J2</span>'); txt.push(`J2`); hitItems.push('J2'); }
    if(row.j3.includes(s3u)) { badges.push('<span class="badge bg-g">J3</span>'); txt.push(`J3`); hitItems.push('J3'); }
    
    return { badges: badges.length > 0 ? badges.join('') : '❌', textList: txt, hitItems: hitItems };
}

function render() {
    document.getElementById('tableBody').innerHTML = database.map((row, idx) => {
        const hits = checkHits(row);
        const isHit = hits.textList.length > 0;
        
        return `
        <tr class="${isHit ? 'row-hit' : ''}">
            <td style="text-align:left;">
                <b>${row.market}</b><br>
                ${row.status ? `<span class="warn-pill">${row.status}</span>` : ''}
                <button class="copy-pill" onclick="copyLine(${idx})">📋 คัดลอก</button>
            </td>
            <td>
                <div class="prime-num bg-b ${hits.hitItems.includes('B') ? 'hit-border' : ''}">${row.primes.B}</div>
                <div class="prime-num bg-p ${hits.hitItems.includes('P') ? 'hit-border' : ''}">${row.primes.P}</div>
                <div class="prime-num bg-k ${hits.hitItems.includes('K') ? 'hit-border' : ''}">${row.primes.K}</div>
            </td>
            <td><div class="drill-box">
                <div class="num-grid">${row.j2.map(n=>`<span class="num-chip" style="${hits.hitItems.includes('J2') && (sortS(row.winValue.substring(1,3))==n || sortS(row.winValue.substring(3,5))==n) ? 'background:#fbbf24' : ''}">${n}</span>`).join('')}</div>
                <div class="num-grid">${row.j3.map(n=>`<span class="num-chip" style="${hits.hitItems.includes('J3') && sortS(row.winValue.substring(0,3))==n ? 'background:#0ea5e9;color:white' : ''}">${n}</span>`).join('')}</div>
            </div></td>
            <td><input type="text" class="res-input" value="${row.winValue}" onchange="updateWin(${idx}, this.value)"></td>
            <td style="${isHit ? 'background:var(--win); color:white;' : ''}">${hits.badges}</td>
        </tr>`;
    }).join('');
}

function processBulk() {
    const input = document.getElementById('bulkInput').value.trim();
    if(!input) return;
    input.split('\n').forEach(line => {
        const parts = line.trim().split(/\s+/);
        if(parts.length >= 2) {
            const m = parts.slice(0, -1).join(' '), nStr = parts[parts.length - 1].replace(/[^0-9]/g, '').slice(-5);
            const d = calculateSet(nStr);
            database.unshift({ market: m, primes: d.primes, status: d.status, pool6: d.pool6, j2: d.j2, j3: d.j3, winValue: "" });
        }
    });
    updateData(); document.getElementById('bulkInput').value = "";
}

function processBulkResult() {
    const input = document.getElementById('bulkResult').value.trim();
    input.split('\n').forEach(line => {
        const parts = line.trim().split(/\s+/);
        if(parts.length >= 2) {
            const resVal = parts[parts.length - 1].replace(/[^0-9]/g, '');
            const target = database.find(r => r.market.includes(parts.slice(0,-1).join(' ')) && !r.winValue);
            if(target) target.winValue = resVal;
        }
    });
    updateData(); document.getElementById('bulkResult').value = "";
}

function calculateStats() {
    let s = {b:0, p:0, k:0, j2:0, j3:0};
    database.forEach(r => {
        const hits = checkHits(r);
        if(hits.hitItems.includes('B')) s.b++; if(hits.hitItems.includes('P')) s.p++;
        if(hits.hitItems.includes('K')) s.k++; if(hits.hitItems.includes('J2')) s.j2++;
        if(hits.hitItems.includes('J3')) s.j3++;
    });
    document.getElementById('st-b').innerText = s.b; document.getElementById('st-p').innerText = s.p;
    document.getElementById('st-k').innerText = s.k; document.getElementById('st-j2').innerText = s.j2; document.getElementById('st-j3').innerText = s.j3;
}

function showCuteReport() {
    const modal = document.getElementById('reportModal'), content = document.getElementById('reportContent');
    let winList = database.filter(r => r.winValue && checkHits(r).textList.length > 0);
    content.innerHTML = `<h3>🌸 SUCCESS REPORT</h3><div style="background:#fff1f2; padding:10px; border-radius:15px; font-weight:800; margin-bottom:10px;">เข้าเป้า: ${winList.length} รอบ</div>
    <div style="text-align:left; font-size:0.65rem;">${winList.map(r=>`✅ <b>${r.market}</b>: ${checkHits(r).textList.join(', ')}`).join('<br>')}</div>`;
    modal.style.display = 'flex';
}

function updateWin(idx, val) { database[idx].winValue = val; updateData(); }
function updateData() { localStorage.setItem('domino_v2026_final_fix_v5', JSON.stringify(database)); render(); calculateStats(); }
function closeReport() { document.getElementById('reportModal').style.display = 'none'; }
function copyFullReport() { navigator.clipboard.writeText(document.getElementById('reportContent').innerText).then(()=>alert("ก๊อปปี้สรุปแล้ว!")); }
function clearAllData() { if(confirm("ล้างข้อมูลทั้งหมด?")) { database = []; updateData(); } }

function copyLine(idx) {
    const r = database[idx];
    const text = `📌 ${r.market} ${r.status || ''}\n🎯 เด่น: ${r.primes.B}-${r.primes.P}-${r.primes.K}\n💎 วิน6: ${r.pool6.join('')}\n✨ เจาะ: ${r.j2.slice(0,5).join(',')}\n🔥 เจาะ3: ${r.j3.slice(0,5).join(',')}`;
    navigator.clipboard.writeText(text).then(() => alert("คัดลอกแล้ว!"));
}

function copyAllToLine() {
    let text = "🚀 สรุป DOMINO 2026 🚀\n\n";
    database.forEach(r => text += `📌 ${r.market} ${r.status || ''} | เด่น ${r.primes.B}-${r.primes.P}-${r.primes.K}\n`);
    navigator.clipboard.writeText(text).then(() => alert("คัดลอกทั้งหมดแล้ว!"));
}

updateData();
</script>
</body>
</html>
